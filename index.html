<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI/테크 트렌드 트래커</title>
<style>
:root {
  color-scheme: light;
  --bg:      #f2f4f7;
  --bg2:     #ffffff;
  --bg3:     #eaecf1;
  --bg4:     #dde1e9;
  --border:  #d6dae3;
  --border2: #b0bac8;
  --text:    #0d0f14;
  --text2:   #424d5e;
  --text3:   #7e8fa3;
  --accent:  #0d0f14;
  --accent2: #1e2a3a;
  --glow:    rgba(13,15,20,.05);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);
     font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
     height:100vh;overflow:hidden;display:flex;flex-direction:column;
     -webkit-font-smoothing:antialiased;}

/* ── HEADER ── */
header{background:var(--bg2);border-bottom:1px solid var(--border);
       padding:0 28px;height:48px;display:flex;align-items:center;
       justify-content:space-between;flex-shrink:0;}
.logo{display:flex;align-items:center;gap:0;}
.logo-mark{display:none;}
.logo h1{font-size:17.2px;font-weight:900;color:var(--text);letter-spacing:-.01em;}
.logo span{display:none;}
.tabs{display:flex;align-items:center;gap:0;border-left:1px solid var(--border);padding-left:20px;margin-left:20px;}
.tab-btn{padding:5px 0;margin-right:24px;border:none;background:transparent;
         color:var(--text3);cursor:pointer;font-size:13.8px;font-weight:900;
         letter-spacing:.05em;text-transform:uppercase;
         border-bottom:2px solid transparent;transition:all .12s;white-space:nowrap;}
.tab-btn.active{color:var(--text);border-bottom:2px solid var(--text);}
.tab-btn:not(.active):hover{color:var(--text2);}

/* ── LAYOUT ── */
.app{display:flex;flex:1;overflow:hidden;}

/* ── SIDEBAR ── */
.sidebar{width:200px;background:var(--bg2);border-right:1px solid var(--border);
         overflow-y:auto;flex-shrink:0;padding-bottom:12px;}
.sidebar::-webkit-scrollbar{width:2px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2);}
.sb-sec{padding:16px 14px 10px;border-bottom:1px solid var(--border);}
.sb-title{font-size:10.4px;font-weight:900;color:var(--text3);text-transform:uppercase;
          letter-spacing:.12em;margin-bottom:10px;}
.frow{display:flex;align-items:center;gap:7px;padding:3px 5px;border-radius:2px;
      cursor:pointer;transition:background .1s;user-select:none;}
.frow:hover{background:var(--bg3);}
.frow.off{opacity:.3;}
.fdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.flabel{font-size:12.7px;flex:1;color:var(--text2);font-weight:900;}
.fcount{font-size:10.4px;color:var(--text3);}
.recent-item{padding:5px 5px;border-radius:2px;cursor:pointer;transition:background .1s;margin-bottom:1px;}
.recent-item:hover{background:var(--bg3);}
.r-meta{display:flex;align-items:center;gap:4px;margin-bottom:1px;}
.r-date{font-size:10.4px;color:var(--text3);}
.r-co{font-size:10.4px;font-weight:900;}
.r-title{font-size:12.1px;font-weight:900;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── CALENDAR ── */
.cal-wrap{display:flex;flex:1;overflow:hidden;}
.cal-main{flex:1;padding:20px 24px;overflow-y:auto;}
.cal-main::-webkit-scrollbar{width:2px;}
.cal-main::-webkit-scrollbar-thumb{background:var(--border2);}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-nav{display:flex;align-items:center;gap:12px;}
.nav-btn{width:28px;height:28px;border-radius:2px;border:1.5px solid var(--border);
         background:transparent;color:var(--text2);cursor:pointer;font-size:16.1px;font-weight:900;
         display:flex;align-items:center;justify-content:center;transition:all .1s;}
.nav-btn:hover{background:var(--text);border-color:var(--text);color:var(--bg2);}
.cal-lbl{font-size:20.7px;font-weight:900;color:var(--text);letter-spacing:-.02em;}
.cal-stat{font-size:12.7px;font-weight:900;color:var(--text3);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-dow{text-align:center;padding:4px 2px;font-size:10.4px;font-weight:900;
         color:var(--text3);text-transform:uppercase;letter-spacing:.06em;}
.cal-day{min-height:88px;background:var(--bg2);
         border:1px solid var(--border);padding:7px 6px 5px;
         cursor:pointer;transition:background .1s;overflow:hidden;}
.cal-day:hover{background:var(--bg3);}
.cal-day.today{border-color:var(--text);}
.cal-day.selected{background:var(--bg3);border-color:var(--text);}
.cal-day.empty{background:transparent;border:none;cursor:default;}
.cal-day.wknd .dnum{color:var(--text3);}
.dnum{font-size:13.8px;font-weight:900;color:var(--text2);margin-bottom:4px;}
.dnum.today-c{font-weight:900;color:var(--text);}
.epill{display:flex;align-items:center;gap:3px;padding:3px 6px;
       font-size:10.4px;font-weight:900;margin-bottom:2px;overflow:hidden;white-space:nowrap;
       border-radius:2px;}
.epill-dot{display:none;}
.epill-txt{overflow:hidden;text-overflow:ellipsis;color:#0e0e0c;}
.more-cnt{font-size:9.2px;color:var(--text3);padding:1px 3px;}

/* ── DETAIL PANEL ── */
.det-panel{width:290px;background:var(--bg2);border-left:1px solid var(--border);
           overflow-y:auto;flex-shrink:0;}
.det-panel::-webkit-scrollbar{width:2px;}
.det-panel::-webkit-scrollbar-thumb{background:var(--border2);}
.det-hdr{padding:16px 18px 12px;border-bottom:1px solid var(--border);}
.det-date{font-size:10.4px;font-weight:900;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;}
.det-cnt{font-size:18.4px;font-weight:900;color:var(--text);letter-spacing:-.01em;}
.det-body{padding:14px 18px;}
.ecard{border-top:1px solid var(--border);
       padding:12px 0;margin-bottom:0;transition:opacity .1s;}
.ecard:hover{opacity:.8;}
.ecard:first-child{border-top:none;padding-top:0;}
.ecard-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.co-tag{font-size:10.4px;padding:2px 7px;font-weight:900;letter-spacing:.02em;color:#0e0e0c;border-radius:2px;}
.cat-tag{font-size:9.8px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);}
.etitle{font-size:13.8px;font-weight:900;margin-bottom:5px;line-height:1.4;color:var(--text);}
.edesc{font-size:12.1px;color:var(--text2);line-height:1.65;}
.echips{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}
.echip{font-size:9.2px;padding:1px 0;color:var(--text3);letter-spacing:.02em;}
.echip::before{content:'#';}
.esrc{display:block;font-size:10.4px;color:var(--text3);margin-top:6px;text-decoration:none;
      text-overflow:ellipsis;overflow:hidden;white-space:nowrap;}
.esrc:hover{color:var(--text);text-decoration:underline;}
.empty-st{padding:28px 0;text-align:center;color:var(--text3);font-size:11.5px;line-height:2;
          text-transform:uppercase;letter-spacing:.06em;}

/* ── MIND MAP ── */
.mm-wrap{flex:1;position:relative;overflow:hidden;}
#mm-canvas{width:100%;height:100%;display:block;background:var(--bg);}
.mm-legend{position:absolute;top:16px;left:16px;background:var(--bg2);
           border:1px solid var(--border);padding:12px 14px;min-width:140px;}
.mm-ltitle{font-size:9.2px;font-weight:900;color:var(--text3);text-transform:uppercase;
           letter-spacing:.1em;margin-bottom:8px;}
.mm-li{display:flex;align-items:center;gap:7px;margin-bottom:4px;font-size:11.5px;color:var(--text2);}
.mm-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.mm-line{width:16px;height:1px;flex-shrink:0;}
.mm-ctrls{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:3px;}
.ctrl-btn{width:28px;height:28px;border:1px solid var(--border);
          background:var(--bg2);color:var(--text2);cursor:pointer;font-size:16.1px;font-weight:300;
          display:flex;align-items:center;justify-content:center;transition:all .1s;}
.ctrl-btn:hover{background:var(--text);border-color:var(--text);color:var(--bg2);}
.mm-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
         font-size:10.4px;color:var(--text3);background:var(--bg2);
         border:1px solid var(--border);padding:4px 12px;letter-spacing:.04em;}

/* ── TOOLTIP ── */
#tooltip{position:fixed;background:var(--bg2);border:1px solid var(--border);
         padding:8px 12px;pointer-events:none;z-index:999;
         display:none;max-width:200px;box-shadow:0 2px 8px rgba(0,0,0,.07);}
#tooltip h4{font-size:12.7px;margin-bottom:3px;color:var(--text);font-weight:900;}
#tooltip p{font-size:11.5px;color:var(--text2);line-height:1.5;}

/* ── FAB ── */
.fab{position:fixed;bottom:20px;right:20px;width:36px;height:36px;
     background:var(--text);color:var(--bg2);border:none;cursor:pointer;font-size:20.7px;
     display:flex;align-items:center;justify-content:center;
     transition:all .15s;z-index:50;}
.fab:hover{background:var(--text2);}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);
         display:none;align-items:center;justify-content:center;z-index:200;}
.overlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);
       padding:24px;width:440px;max-width:95vw;box-shadow:0 4px 24px rgba(0,0,0,.08);}
.modal h2{font-size:15.0px;font-weight:900;margin-bottom:18px;color:var(--text);letter-spacing:.02em;}
.fg{margin-bottom:10px;}
.fg label{display:block;font-size:10.4px;color:var(--text3);font-weight:900;
          letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;}
.fg input,.fg select,.fg textarea{width:100%;background:var(--bg3);border:1px solid var(--border);
  padding:7px 10px;color:var(--text);font-size:12.7px;outline:none;
  transition:border-color .1s;font-family:inherit;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--text);}
.fg textarea{resize:vertical;min-height:60px;}
.modal-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:18px;}
.btn{padding:7px 16px;border:1px solid var(--border);cursor:pointer;
     font-size:12.7px;font-weight:900;transition:all .1s;font-family:inherit;letter-spacing:.04em;}
.btn-primary{background:var(--text);color:var(--bg2);border-color:var(--text);}
.btn-primary:hover{background:var(--text2);}
.btn-ghost{background:transparent;color:var(--text2);}
.btn-ghost:hover{color:var(--text);}
.section{display:none;}
.section.active{display:flex;flex:1;overflow:hidden;}

/* ── PEOPLE / COMPANIES TAB ── */
.ppl-wrap{display:flex;flex:1;overflow:hidden;}
.ppl-list{width:180px;background:var(--bg2);border-right:1px solid var(--border);
          overflow-y:auto;flex-shrink:0;padding-bottom:12px;}
.ppl-list::-webkit-scrollbar{width:2px;}
.ppl-list::-webkit-scrollbar-thumb{background:var(--border2);}
.ppl-grp-lbl{font-size:9.2px;font-weight:900;color:var(--text3);text-transform:uppercase;
             letter-spacing:.1em;padding:14px 14px 6px;}
.ppl-co-btn{display:flex;align-items:center;gap:8px;padding:5px 14px;cursor:pointer;
            border:none;background:transparent;width:100%;text-align:left;transition:background .1s;}
.ppl-co-btn:hover{background:var(--bg3);}
.ppl-co-btn.sel{background:var(--bg3);border-right:1px solid var(--text);}
.ppl-co-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.ppl-co-name{font-size:12.7px;color:var(--text2);font-weight:900;}

.ppl-main{flex:1;overflow-y:auto;padding:24px 28px;}
.ppl-main::-webkit-scrollbar{width:2px;}
.ppl-main::-webkit-scrollbar-thumb{background:var(--border2);}
.ppl-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;
                 height:100%;color:var(--text3);font-size:11.5px;gap:6px;
                 text-transform:uppercase;letter-spacing:.06em;}

.co-hdr{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;}
.co-icon{width:44px;height:44px;display:flex;align-items:center;
         justify-content:center;font-size:22.9px;flex-shrink:0;border:1px solid var(--border);}
.co-hdr-meta h2{font-size:22.9px;font-weight:900;color:var(--text);margin-bottom:5px;letter-spacing:-.02em;}
.co-pills{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
.co-grp-pill{font-size:9.2px;padding:2px 7px;font-weight:900;color:var(--bg2);}
.co-info-pill{font-size:9.2px;padding:2px 6px;
              background:var(--bg4);color:var(--text3);}
.co-ceo-pill{font-size:9.2px;padding:2px 7px;
             background:var(--bg3);color:var(--text2);font-weight:900;}

.co-desc{font-size:12.7px;color:var(--text2);line-height:1.8;
         border-left:2px solid var(--border2);
         padding-left:12px;margin-bottom:20px;}

.sec-title{font-size:9.2px;font-weight:900;color:var(--text3);text-transform:uppercase;
           letter-spacing:.1em;margin-bottom:10px;margin-top:22px;display:flex;
           align-items:center;gap:8px;}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border);}

.prod-wrap{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px;}
.prod-chip{font-size:11.5px;padding:2px 8px;
           background:var(--bg3);color:var(--text2);
           border:1px solid var(--border);}

.ppl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}
.person-card{border:1px solid var(--border);padding:11px 13px;}
.person-name{font-size:13.8px;font-weight:900;color:var(--text);margin-bottom:2px;}
.person-role{font-size:10.4px;color:var(--text3);font-weight:900;margin-bottom:5px;
             text-transform:uppercase;letter-spacing:.04em;}
.person-note{font-size:11.5px;color:var(--text2);line-height:1.55;}

.moves-list{display:flex;flex-direction:column;gap:0;}
.move-card{border-top:1px solid var(--border);
           padding:10px 0;display:flex;gap:14px;align-items:flex-start;}
.move-card:first-child{border-top:none;padding-top:0;}
.move-yr{font-size:12.7px;font-weight:900;color:var(--text3);min-width:34px;padding-top:1px;}
.move-body{}
.move-person{font-size:13.8px;font-weight:900;color:var(--text);margin-bottom:2px;}
.move-path{font-size:11.5px;color:var(--text2);margin-bottom:3px;}
.move-path .arr{color:var(--text3);margin:0 4px;}
.move-note{font-size:11.5px;color:var(--text3);line-height:1.5;}

/* ── CO FILTER SELECT ── */
.frow.co-sel{background:var(--bg4);}
.frow.co-sel .flabel{color:var(--text);font-weight:900;}
.frow.co-sel .fdot{outline:2px solid var(--text);outline-offset:1px;}

/* ── CALENDAR CO HIGHLIGHT ── */
.cal-day.co-highlight{border-width:2px;border-color:var(--text2);background:var(--bg3);}
.cal-day.co-highlight .dnum{color:var(--text);font-weight:900;}

/* ── ECARD DATE ── */
.ecard-date{font-size:9.5px;font-weight:900;color:var(--text3);
            letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">🔭</div>
    <div>
      <h1>AI/테크 트렌드 트래커</h1>
      <span>빅테크 · AI · 크리에이티브 · 한국 기업 실시간 이슈 보드</span>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:16px;">
    <div id="last-updated" style="font-size:10px;color:var(--text3);white-space:nowrap;"></div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="cal" onclick="switchTab('cal')">캘린더</button>
      <button class="tab-btn" data-tab="mm" onclick="switchTab('mm')">마인드맵</button>
      <button class="tab-btn" data-tab="ppl" onclick="switchTab('ppl')">인물 · 기업</button>
    </div>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="sb-sec"><div class="sb-title">기업 필터</div><div id="co-filters"></div></div>
    <div class="sb-sec"><div class="sb-title">카테고리</div><div id="cat-filters"></div></div>
    <div class="sb-sec" style="border:none"><div class="sb-title">최근 이슈</div><div id="recent-list"></div></div>
  </aside>

  <div id="cal-section" class="section active">
    <div class="cal-wrap">
      <div class="cal-main">
        <div class="cal-hdr">
          <div class="cal-nav">
            <button class="nav-btn" onclick="prevMonth()">‹</button>
            <span class="cal-lbl" id="cal-lbl"></span>
            <button class="nav-btn" onclick="nextMonth()">›</button>
          </div>
          <span class="cal-stat" id="cal-stat"></span>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
      <div class="det-panel">
        <div class="det-hdr">
          <div class="det-date" id="det-date">날짜 또는 기업을 선택하세요</div>
          <div class="det-cnt" id="det-cnt">이슈 상세</div>
        </div>
        <div class="det-body" id="det-body">
          <div class="empty-st">날짜를 선택하세요</div>
        </div>
      </div>
    </div>
  </div>

  <div id="ppl-section" class="section">
    <div class="ppl-wrap">
      <div class="ppl-list" id="ppl-list"></div>
      <div class="ppl-main" id="ppl-main">
        <div class="ppl-placeholder">
          <div>기업을 선택하세요</div>
        </div>
      </div>
    </div>
  </div>

  <div id="mm-section" class="section" style="position:relative;">
    <div class="mm-wrap">
      <canvas id="mm-canvas"></canvas>
      <div class="mm-legend">
        <div class="mm-ltitle">기업 그룹</div>
        <div class="mm-li"><div class="mm-dot" style="background:#d4a574"></div>AI 연구소</div>
        <div class="mm-li"><div class="mm-dot" style="background:#4285f4"></div>빅테크</div>
        <div class="mm-li"><div class="mm-dot" style="background:#76b900"></div>하드웨어</div>
        <div class="mm-li"><div class="mm-dot" style="background:#1428a0"></div>한국 기업</div>
        <div class="mm-li"><div class="mm-dot" style="background:#f97316"></div>크리에이티브</div>
        <div class="mm-li"><div class="mm-dot" style="background:#8b5cf6"></div>스타트업/기타</div>
        <div class="mm-li"><div class="mm-dot" style="background:#aaaacc;border:1.5px solid #6366f1;box-sizing:border-box"></div>주제/제품</div>
        <div style="margin-top:8px;border-top:1px solid var(--border);padding-top:7px;">
          <div class="mm-ltitle">관계 유형</div>
          <div class="mm-li"><div class="mm-line" style="background:#ef4444"></div>인수/M&A</div>
          <div class="mm-li"><div class="mm-line" style="background:#10b981"></div>파트너십</div>
          <div class="mm-li"><div class="mm-line" style="background:#6366f1"></div>제품 출시</div>
          <div class="mm-li"><div class="mm-line" style="background:#f59e0b"></div>인프라/투자</div>
          <div class="mm-li"><div class="mm-line" style="background:#8b5cf6"></div>규제/정책</div>
        </div>
      </div>
      <div class="mm-ctrls">
        <button class="ctrl-btn" onclick="mmZoomIn()">+</button>
        <button class="ctrl-btn" onclick="mmZoomOut()">−</button>
        <button class="ctrl-btn" onclick="mmReset()">⊙</button>
      </div>
      <div class="mm-hint">드래그로 이동 · 스크롤로 확대/축소 · 노드 드래그 가능</div>
    </div>
  </div>
</div>

<button class="fab" onclick="openModal()">+</button>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>이슈 추가</h2>
    <div class="fg"><label>날짜</label><input type="date" id="f-date"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">
      <div class="fg"><label>기업</label>
        <select id="f-co">
          <option>Anthropic</option><option>OpenAI</option><option>Google</option>
          <option>Microsoft</option><option>Meta</option><option>Apple</option>
          <option>NVIDIA</option><option>xAI</option><option>Samsung</option>
          <option>Naver</option><option>Kakao</option><option>LG</option><option>SK</option>

  {id:58,date:'2026-05-26',company:'Anthropic',companies:['Anthropic'],category:'regulation',

  {id:61,date:'2026-05-27',company:'Anthropic',companies:['Anthropic'],category:'acquisition',

  {id:79,date:'2026-06-01',company:'NVIDIA',companies:['NVIDIA'],category:'model',
   title:'NVIDIA GTC 타이베이 기조연설 — Nemotron 3 Ultra(500B+) 오픈 AI 모델 발표',
   description:'Jensen Huang이 COMPUTEX 2026에서 GTC 타이베이 기조연설을 통해 Nemotron 3 Ultra 공개. 약 500~550억 파라미터 규모의 NVIDIA 오픈 AI 모델 패밀리 최강자. 에이전틱 워크플로우·고급 추론·멀티스텝 계획 특화 설계. Spectrum-X 이더넷 패브릭 AI 네트워킹 보급 확대 발표. Grace Blackwell·Vera Rubin 등 차세대 GPU 아키텍처 로드맵 힌트 제공.',
