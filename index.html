<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI/테크 트렌드 트래커</title>
<style>
:root {
  color-scheme: light;
  --bg:      #f2f4f7;
  --bg2:     #ffffff;
  --bg3:     #eaecf1;
  --bg4:     #dde1e9;
  --border:  #d6dae3;
  --border2: #b0bac8;
  --text:    #0d0f14;
  --text2:   #424d5e;
  --text3:   #7e8fa3;
  --accent:  #0d0f14;
  --accent2: #1e2a3a;
  --glow:    rgba(13,15,20,.05);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);
     font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
     height:100vh;overflow:hidden;display:flex;flex-direction:column;
     -webkit-font-smoothing:antialiased;}

/* ── HEADER ── */
header{background:var(--bg2);border-bottom:1px solid var(--border);
       padding:0 28px;height:48px;display:flex;align-items:center;
       justify-content:space-between;flex-shrink:0;}
.logo{display:flex;align-items:center;gap:0;}
.logo-mark{display:none;}
.logo h1{font-size:17.2px;font-weight:900;color:var(--text);letter-spacing:-.01em;}
.logo span{display:none;}
.tabs{display:flex;align-items:center;gap:0;border-left:1px solid var(--border);padding-left:20px;margin-left:20px;}
.tab-btn{padding:5px 0;margin-right:24px;border:none;background:transparent;
         color:var(--text3);cursor:pointer;font-size:13.8px;font-weight:900;
         letter-spacing:.05em;text-transform:uppercase;
         border-bottom:2px solid transparent;transition:all .12s;white-space:nowrap;}
.tab-btn.active{color:var(--text);border-bottom:2px solid var(--text);}
.tab-btn:not(.active):hover{color:var(--text2);}

/* ── LAYOUT ── */
.app{display:flex;flex:1;overflow:hidden;}

/* ── SIDEBAR ── */
.sidebar{width:200px;background:var(--bg2);border-right:1px solid var(--border);
         overflow-y:auto;flex-shrink:0;padding-bottom:12px;}
.sidebar::-webkit-scrollbar{width:2px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2);}
.sb-sec{padding:16px 14px 10px;border-bottom:1px solid var(--border);}
.sb-title{font-size:10.4px;font-weight:900;color:var(--text3);text-transform:uppercase;
          letter-spacing:.12em;margin-bottom:10px;}
.frow{display:flex;align-items:center;gap:7px;padding:3px 5px;border-radius:2px;
      cursor:pointer;transition:background .1s;user-select:none;}
.frow:hover{background:var(--bg3);}
.frow.off{opacity:.3;}
.fdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.flabel{font-size:12.7px;flex:1;color:var(--text2);font-weight:900;}
.fcount{font-size:10.4px;color:var(--text3);}
.recent-item{padding:5px 5px;border-radius:2px;cursor:pointer;transition:background .1s;margin-bottom:1px;}
.recent-item:hover{background:var(--bg3);}
.r-meta{display:flex;align-items:center;gap:4px;margin-bottom:1px;}
.r-date{font-size:10.4px;color:var(--text3);}
.r-co{font-size:10.4px;font-weight:900;}
.r-title{font-size:12.1px;font-weight:900;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── CALENDAR ── */
.cal-wrap{display:flex;flex:1;overflow:hidden;}
.cal-main{flex:1;padding:20px 24px;overflow-y:auto;}
.cal-main::-webkit-scrollbar{width:2px;}
.cal-main::-webkit-scrollbar-thumb{background:var(--border2);}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-nav{display:flex;align-items:center;gap:12px;}
.nav-btn{width:28px;height:28px;border-radius:2px;border:1.5px solid var(--border);
         background:transparent;color:var(--text2);cursor:pointer;font-size:16.1px;font-weight:900;
         display:flex;align-items:center;justify-content:center;transition:all .1s;}
.nav-btn:hover{background:var(--text);border-color:var(--text);color:var(--bg2);}
.cal-lbl{font-size:20.7px;font-weight:900;color:var(--text);letter-spacing:-.02em;}
.cal-stat{font-size:12.7px;font-weight:900;color:var(--text3);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-dow{text-align:center;padding:4px 2px;font-size:10.4px;font-weight:900;
         color:var(--text3);text-transform:uppercase;letter-spacing:.06em;}
.cal-day{min-height:88px;background:var(--bg2);
         border:1px solid var(--border);padding:7px 6px 5px;
         cursor:pointer;transition:background .1s;overflow:hidden;}
.cal-day:hover{background:var(--bg3);}
.cal-day.today{border-color:var(--text);}
.cal-day.selected{background:var(--bg3);border-color:var(--text);}
.cal-day.empty{background:transparent;border:none;cursor:default;}
.cal-day.wknd .dnum{color:var(--text3);}
.dnum{font-size:13.8px;font-weight:900;color:var(--text2);margin-bottom:4px;}
.dnum.today-c{font-weight:900;color:var(--text);}
.epill{display:flex;align-items:center;gap:3px;padding:3px 6px;
       font-size:10.4px;font-weight:900;margin-bottom:2px;overflow:hidden;white-space:nowrap;
       border-radius:2px;}
.epill-dot{display:none;}
.epill-txt{overflow:hidden;text-overflow:ellipsis;color:#0e0e0c;}
.more-cnt{font-size:9.2px;color:var(--text3);padding:1px 3px;}

/* ── DETAIL PANEL ── */
.det-panel{width:290px;background:var(--bg2);border-left:1px solid var(--border);
           overflow-y:auto;flex-shrink:0;}
.det-panel::-webkit-scrollbar{width:2px;}
.det-panel::-webkit-scrollbar-thumb{background:var(--border2);}
.det-hdr{padding:16px 18px 12px;border-bottom:1px solid var(--border);}
.det-date{font-size:10.4px;font-weight:900;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;}
.det-cnt{font-size:18.4px;font-weight:900;color:var(--text);letter-spacing:-.01em;}
.det-body{padding:14px 18px;}
.ecard{border-top:1px solid var(--border);
       padding:12px 0;margin-bottom:0;transition:opacity .1s;}
.ecard:hover{opacity:.8;}
.ecard:first-child{border-top:none;padding-top:0;}
.ecard-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.co-tag{font-size:10.4px;padding:2px 7px;font-weight:900;letter-spacing:.02em;color:#0e0e0c;border-radius:2px;}
.cat-tag{font-size:9.8px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);}
.etitle{font-size:13.8px;font-weight:900;margin-bottom:5px;line-height:1.4;color:var(--text);}
.edesc{font-size:12.1px;color:var(--text2);line-height:1.65;}
.echips{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}
.echip{font-size:9.2px;padding:1px 0;color:var(--text3);letter-spacing:.02em;}
.echip::before{content:'#';}
.esrc{display:block;font-size:10.4px;color:var(--text3);margin-top:6px;text-decoration:none;
      text-overflow:ellipsis;overflow:hidden;white-space:nowrap;}
.esrc:hover{color:var(--text);text-decoration:underline;}
.empty-st{padding:28px 0;text-align:center;color:var(--text3);font-size:11.5px;line-height:2;
          text-transform:uppercase;letter-spacing:.06em;}

/* ── MIND MAP ── */
.mm-wrap{flex:1;position:relative;overflow:hidden;}
#mm-canvas{width:100%;height:100%;display:block;background:var(--bg);}
.mm-legend{position:absolute;top:16px;left:16px;background:var(--bg2);
           border:1px solid var(--border);padding:12px 14px;min-width:140px;}
.mm-ltitle{font-size:9.2px;font-weight:900;color:var(--text3);text-transform:uppercase;
           letter-spacing:.1em;margin-bottom:8px;}
.mm-li{display:flex;align-items:center;gap:7px;margin-bottom:4px;font-size:11.5px;color:var(--text2);}
.mm-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.mm-line{width:16px;height:1px;flex-shrink:0;}
.mm-ctrls{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:3px;}
.ctrl-btn{width:28px;height:28px;border:1px solid var(--border);
          background:var(--bg2);color:var(--text2);cursor:pointer;font-size:16.1px;font-weight:300;
          display:flex;align-items:center;justify-content:center;transition:all .1s;}
.ctrl-btn:hover{background:var(--text);border-color:var(--text);color:var(--bg2);}
.mm-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
         font-size:10.4px;color:var(--text3);background:var(--bg2);
         border:1px solid var(--border);padding:4px 12px;letter-spacing:.04em;}

/* ── TOOLTIP ── */
#tooltip{position:fixed;background:var(--bg2);border:1px solid var(--border);
         padding:8px 12px;pointer-events:none;z-index:999;
         display:none;max-width:200px;box-shadow:0 2px 8px rgba(0,0,0,.07);}
#tooltip h4{font-size:12.7px;margin-bottom:3px;color:var(--text);font-weight:900;}
#tooltip p{font-size:11.5px;color:var(--text2);line-height:1.5;}

/* ── FAB ── */
.fab{position:fixed;bottom:20px;right:20px;width:36px;height:36px;
     background:var(--text);color:var(--bg2);border:none;cursor:pointer;font-size:20.7px;
     display:flex;align-items:center;justify-content:center;
     transition:all .15s;z-index:50;}
.fab:hover{background:var(--text2);}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);
         display:none;align-items:center;justify-content:center;z-index:200;}
.overlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);
       padding:24px;width:440px;max-width:95vw;box-shadow:0 4px 24px rgba(0,0,0,.08);}
.modal h2{font-size:15.0px;font-weight:900;margin-bottom:18px;color:var(--text);letter-spacing:.02em;}
.fg{margin-bottom:10px;}
.fg label{display:block;font-size:10.4px;color:var(--text3);font-weight:900;
          letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;}
.fg input,.fg select,.fg textarea{width:100%;background:var(--bg3);border:1px solid var(--border);
  padding:7px 10px;color:var(--text);font-size:12.7px;outline:none;
  transition:border-color .1s;font-family:inherit;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--text);}
.fg textarea{resize:vertical;min-height:60px;}
.modal-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:18px;}
.btn{padding:7px 16px;border:1px solid var(--border);cursor:pointer;
     font-size:12.7px;font-weight:900;transition:all .1s;font-family:inherit;letter-spacing:.04em;}
.btn-primary{background:var(--text);color:var(--bg2);border-color:var(--text);}
.btn-primary:hover{background:var(--text2);}
.btn-ghost{background:transparent;color:var(--text2);}
.btn-ghost:hover{color:var(--text);}
.section{display:none;}
.section.active{display:flex;flex:1;overflow:hidden;}

/* ── PEOPLE / COMPANIES TAB ── */
.ppl-wrap{display:flex;flex:1;overflow:hidden;}
.ppl-list{width:180px;background:var(--bg2);border-right:1px solid var(--border);
          overflow-y:auto;flex-shrink:0;padding-bottom:12px;}
.ppl-list::-webkit-scrollbar{width:2px;}
.ppl-list::-webkit-scrollbar-thumb{background:var(--border2);}
.ppl-grp-lbl{font-size:9.2px;font-weight:900;color:var(--text3);text-transform:uppercase;
             letter-spacing:.1em;padding:14px 14px 6px;}
.ppl-co-btn{display:flex;align-items:center;gap:8px;padding:5px 14px;cursor:pointer;
            border:none;background:transparent;width:100%;text-align:left;transition:background .1s;}
.ppl-co-btn:hover{background:var(--bg3);}
.ppl-co-btn.sel{background:var(--bg3);border-right:1px solid var(--text);}
.ppl-co-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.ppl-co-name{font-size:12.7px;color:var(--text2);font-weight:900;}

.ppl-main{flex:1;overflow-y:auto;padding:24px 28px;}
.ppl-main::-webkit-scrollbar{width:2px;}
.ppl-main::-webkit-scrollbar-thumb{background:var(--border2);}
.ppl-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;
                 height:100%;color:var(--text3);font-size:11.5px;gap:6px;
                 text-transform:uppercase;letter-spacing:.06em;}

.co-hdr{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;}
.co-icon{width:44px;height:44px;display:flex;align-items:center;
         justify-content:center;font-size:22.9px;flex-shrink:0;border:1px solid var(--border);}
.co-hdr-meta h2{font-size:22.9px;font-weight:900;color:var(--text);margin-bottom:5px;letter-spacing:-.02em;}
.co-pills{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
.co-grp-pill{font-size:9.2px;padding:2px 7px;font-weight:900;color:var(--bg2);}
.co-info-pill{font-size:9.2px;padding:2px 6px;
              background:var(--bg4);color:var(--text3);}
.co-ceo-pill{font-size:9.2px;padding:2px 7px;
             background:var(--bg3);color:var(--text2);font-weight:900;}

.co-desc{font-size:12.7px;color:var(--text2);line-height:1.8;
         border-left:2px solid var(--border2);
         padding-left:12px;margin-bottom:20px;}

.sec-title{font-size:9.2px;font-weight:900;color:var(--text3);text-transform:uppercase;
           letter-spacing:.1em;margin-bottom:10px;margin-top:22px;display:flex;
           align-items:center;gap:8px;}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border);}

.prod-wrap{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px;}
.prod-chip{font-size:11.5px;padding:2px 8px;
           background:var(--bg3);color:var(--text2);
           border:1px solid var(--border);}

.ppl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}
.person-card{border:1px solid var(--border);padding:11px 13px;}
.person-name{font-size:13.8px;font-weight:900;color:var(--text);margin-bottom:2px;}
.person-role{font-size:10.4px;color:var(--text3);font-weight:900;margin-bottom:5px;
             text-transform:uppercase;letter-spacing:.04em;}
.person-note{font-size:11.5px;color:var(--text2);line-height:1.55;}

.moves-list{display:flex;flex-direction:column;gap:0;}
.move-card{border-top:1px solid var(--border);
           padding:10px 0;display:flex;gap:14px;align-items:flex-start;}
.move-card:first-child{border-top:none;padding-top:0;}
.move-yr{font-size:12.7px;font-weight:900;color:var(--text3);min-width:34px;padding-top:1px;}
.move-body{}
.move-person{font-size:13.8px;font-weight:900;color:var(--text);margin-bottom:2px;}
.move-path{font-size:11.5px;color:var(--text2);margin-bottom:3px;}
.move-path .arr{color:var(--text3);margin:0 4px;}
.move-note{font-size:11.5px;color:var(--text3);line-height:1.5;}

/* ── CO FILTER SELECT ── */
.frow.co-sel{background:var(--bg4);}
.frow.co-sel .flabel{color:var(--text);font-weight:900;}
.frow.co-sel .fdot{outline:2px solid var(--text);outline-offset:1px;}

/* ── CALENDAR CO HIGHLIGHT ── */
.cal-day.co-highlight{border-width:2px;border-color:var(--text2);background:var(--bg3);}
.cal-day.co-highlight .dnum{color:var(--text);font-weight:900;}

/* ── ECARD DATE ── */
.ecard-date{font-size:9.5px;font-weight:900;color:var(--text3);
            letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">🔭</div>
    <div>
      <h1>AI/테크 트렌드 트래커</h1>
      <span>빅테크 · AI · 크리에이티브 · 한국 기업 실시간 이슈 보드</span>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:16px;">
    <div id="last-updated" style="font-size:10px;color:var(--text3);white-space:nowrap;"></div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="cal" onclick="switchTab('cal')">캘린더</button>
      <button class="tab-btn" data-tab="mm" onclick="switchTab('mm')">마인드맵</button>
      <button class="tab-btn" data-tab="ppl" onclick="switchTab('ppl')">인물 · 기업</button>
    </div>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="sb-sec"><div class="sb-title">기업 필터</div><div id="co-filters"></div></div>
    <div class="sb-sec"><div class="sb-title">카테고리</div><div id="cat-filters"></div></div>
    <div class="sb-sec" style="border:none"><div class="sb-title">최근 이슈</div><div id="recent-list"></div></div>
  </aside>

  <div id="cal-section" class="section active">
    <div class="cal-wrap">
      <div class="cal-main">
        <div class="cal-hdr">
          <div class="cal-nav">
            <button class="nav-btn" onclick="prevMonth()">‹</button>
            <span class="cal-lbl" id="cal-lbl"></span>
            <button class="nav-btn" onclick="nextMonth()">›</button>
          </div>
          <span class="cal-stat" id="cal-stat"></span>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
      <div class="det-panel">
        <div class="det-hdr">
          <div class="det-date" id="det-date">날짜 또는 기업을 선택하세요</div>
          <div class="det-cnt" id="det-cnt">이슈 상세</div>
        </div>
        <div class="det-body" id="det-body">
          <div class="empty-st">날짜를 선택하세요</div>
        </div>
      </div>
    </div>
  </div>

  <div id="ppl-section" class="section">
    <div class="ppl-wrap">
      <div class="ppl-list" id="ppl-list"></div>
      <div class="ppl-main" id="ppl-main">
        <div class="ppl-placeholder">
          <div>기업을 선택하세요</div>
        </div>
      </div>
    </div>
  </div>

  <div id="mm-section" class="section" style="position:relative;">
    <div class="mm-wrap">
      <canvas id="mm-canvas"></canvas>
      <div class="mm-legend">
        <div class="mm-ltitle">기업 그룹</div>
        <div class="mm-li"><div class="mm-dot" style="background:#d4a574"></div>AI 연구소</div>
        <div class="mm-li"><div class="mm-dot" style="background:#4285f4"></div>빅테크</div>
        <div class="mm-li"><div class="mm-dot" style="background:#76b900"></div>하드웨어</div>
        <div class="mm-li"><div class="mm-dot" style="background:#1428a0"></div>한국 기업</div>
        <div class="mm-li"><div class="mm-dot" style="background:#f97316"></div>크리에이티브</div>
        <div class="mm-li"><div class="mm-dot" style="background:#8b5cf6"></div>스타트업/기타</div>
        <div class="mm-li"><div class="mm-dot" style="background:#aaaacc;border:1.5px solid #6366f1;box-sizing:border-box"></div>주제/제품</div>
        <div style="margin-top:8px;border-top:1px solid var(--border);padding-top:7px;">
          <div class="mm-ltitle">관계 유형</div>
          <div class="mm-li"><div class="mm-line" style="background:#ef4444"></div>인수/M&A</div>
          <div class="mm-li"><div class="mm-line" style="background:#10b981"></div>파트너십</div>
          <div class="mm-li"><div class="mm-line" style="background:#6366f1"></div>제품 출시</div>
          <div class="mm-li"><div class="mm-line" style="background:#f59e0b"></div>인프라/투자</div>
          <div class="mm-li"><div class="mm-line" style="background:#8b5cf6"></div>규제/정책</div>
        </div>
      </div>
      <div class="mm-ctrls">
        <button class="ctrl-btn" onclick="mmZoomIn()">+</button>
        <button class="ctrl-btn" onclick="mmZoomOut()">−</button>
        <button class="ctrl-btn" onclick="mmReset()">⊙</button>
      </div>
      <div class="mm-hint">드래그로 이동 · 스크롤로 확대/축소 · 노드 드래그 가능</div>
    </div>
  </div>
</div>

<button class="fab" onclick="openModal()">+</button>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>이슈 추가</h2>
    <div class="fg"><label>날짜</label><input type="date" id="f-date"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">
      <div class="fg"><label>기업</label>
        <select id="f-co">
          <option>Anthropic</option><option>OpenAI</option><option>Google</option>
          <option>Microsoft</option><option>Meta</option><option>Apple</option>
          <option>NVIDIA</option><option>xAI</option><option>Samsung</option>
          <option>Naver</option><option>Kakao</option><option>LG</option><option>SK</option>

  {id:58,date:'2026-05-26',company:'Anthropic',companies:['Anthropic'],category:'regulation',

  {id:61,date:'2026-05-27',company:'Anthropic',companies:['Anthropic'],category:'acquisition',

  {id:79,date:'2026-06-01',company:'NVIDIA',companies:['NVIDIA'],category:'model',
   title:'NVIDIA GTC 타이베이 기조연설 — Nemotron 3 Ultra(500B+) 오픈 AI 모델 발표',
   description:'Jensen Huang이 COMPUTEX 2026에서 GTC 타이베이 기조연설을 통해 Nemotron 3 Ultra 공개. 약 500~550억 파라미터 규모의 NVIDIA 오픈 AI 모델 패밀리 최강자. 에이전틱 워크플로우·고급 추론·멀티스텝 계획 특화 설계. Spectrum-X 이더넷 패브릭 AI 네트워킹 보급 확대 발표. Grace Blackwell·Vera Rubin 등 차세대 GPU 아키텍처 로드맵 힌트 제공.',

  {id:80,date:'2026-06-01',company:'Anthropic',companies:['Anthropic'],category:'regulation',
   title:'Anthropic, $965B 밸류에이션 IPO 기밀 신청 — 첫 순수 AI 상장사 도전',
   description:'Anthropic이 Series H $65B 라운드 마감 직후 SEC에 기밀 IPO 예비심사(S-1) 신청. $965B 기업가치로 OpenAI($852B)보다 먼저 공개 시장에 도전하며 "세계 첫 순수 AI 상장사" 내러티브 선점. 연환산 매출 $47B, Q2 예상 매출 $10.9B(전분기 2배+). 공개 S-1은 60~90일 후 제출 예정.',
   tags:['IPO','S-1','SEC','$965B','상장'],source:'https://fortune.com/2026/06/01/anthropic-confidentially-files-ipo-965-billion-valuation/'},
  {id:81,date:'2026-06-02',company:'Microsoft',companies:['Microsoft'],category:'model',
   title:'Microsoft Build 2026 — MAI-Thinking-1·MAI-Code-1-Flash 자체 AI 모델 7종 발표',
   description:'Microsoft가 Build 2026(샌프란시스코, 6/2~3)에서 OpenAI 데이터 없이 학습한 첫 자체 추론 모델 MAI-Thinking-1과 GitHub Copilot 전용 코딩 모델 MAI-Code-1-Flash 포함 AI 모델 7종 발표. MAI-Code-1-Flash는 유사 모델 대비 토큰 60% 절감, Copilot 전 티어(Free·Pro·Pro+·Max) 즉시 배포. OpenAI 의존도를 줄이고 개발자 비용 낮추기 위한 자체 모델 전략 공식화.',
   tags:['MAI-Thinking-1','MAI-Code-1-Flash','Build2026','자체모델','GitHubCopilot'],source:'https://www.cnbc.com/2026/06/02/microsoft-unveils-new-ai-models-lessen-reliance-on-openai-lower-costs.html'},
  {id:82,date:'2026-06-02',company:'Anthropic',companies:['Anthropic','Samsung'],category:'regulation',
   title:'Project Glasswing 확장 — Claude Mythos, 15개국+ 150개 기관 공개',
   description:'Anthropic이 Project Glasswing을 15개국 이상 150개 신규 기관으로 확대. 전력·수도·헬스케어·통신·하드웨어 등 핵심 인프라 분야 포함. Samsung, NATO 참여 확인. Claude Mythos가 1만개+ 제로데이 취약점 발견한 이후 첫 대규모 확장. IPO 기밀 신청 다음 날 발표.',
   tags:['ProjectGlasswing','ClaudeMythos','사이버보안','NATO','핵심인프라'],source:'https://techcrunch.com/2026/06/02/anthropic-scales-claude-mythos-to-critical-infrastructure-in-15-countries/'},
  {id:83,date:'2026-06-02',company:'OpenAI',companies:['OpenAI','Microsoft','Google','Anthropic'],category:'regulation',
   title:'트럼프, AI 혁신·보안 행정명령 서명 — 출시 30일 전 자발적 정부 검토 도입',
   description:'트럼프 대통령이 \"AI 혁신 및 보안 촉진\" 행정명령 서명(6/2). 강력 AI 모델 출시 30일 전 자발적 정부 검토 제도화, AI 사이버보안 클리어링하우스 설립, 기밀 벤치마크 개발. 바이든 행정부의 규제 중심과 달리 혁신 우선·자발적 협력 방식 채택. 강제 라이선스·사전 허가 명시적 금지.',
   tags:['트럼프','행정명령','AI규제','사이버보안','자발적검토'],source:'https://www.whitehouse.gov/presidential-actions/2026/06/promoting-advanced-artificial-intelligence-innovation-and-security/'},
  {id:84,date:'2026-06-02',company:'NVIDIA',companies:['NVIDIA','Microsoft'],category:'product',
   title:'NVIDIA RTX Spark + Microsoft — 에이전트 네이티브 Windows AI PC 발표 (Build 2026)',
   description:'NVIDIA가 Microsoft Build 2026에서 RTX Spark 슈퍼칩 발표. 1페타플롭 AI 성능, 최대 128GB 통합 메모리, 20코어 Grace CPU + Blackwell RTX GPU 결합. 로컬에서 120B 파라미터 LLM 구동, 4K AI 비디오 생성, 12K 영상 편집 지원. ASUS·Dell·HP·Lenovo·Microsoft Surface·MSI 등 2026년 가을 출시 예정. Surface RTX Spark Dev Box 개발자용 동시 공개.',
   tags:['RTXSpark','WindowsAI','에이전트PC','Blackwell','로컬AI'],source:'https://nvidianews.nvidia.com/news/nvidia-microsoft-windows-pcs-agents-rtx-spark'},
  {id:85,date:'2026-06-03',company:'Anthropic',companies:['Anthropic'],category:'partnership',
   title:'Anthropic, Claude Partner Network에 Services Track·Partner Hub 신설 — 엔터프라이즈 확장',
   description:'Anthropic이 3개월 된 Claude Partner Network에 컨설팅·SI 파트너용 Services Track과 Partner Hub 포털을 추가. Services Track은 Select(인증 실무자 10명+·운영 배포 2건+), Preferred(100명·15고객), Global Premier(1,000명·100고객·3개 지역+) 3개 티어로 구성. Partner Hub는 파트너의 자격 충족 현황과 고객의 적합 파트너 매칭을 매일 갱신. 3월 출범 이후 4만개+ 기업 지원, 1만명+ 컨설턴트가 Claude 인증 취득.',
   tags:['ClaudePartnerNetwork','ServicesTrack','PartnerHub','엔터프라이즈','파트너십'],source:'https://www.anthropic.com/news/services-track-partner-hub'},
  {id:86,date:'2026-06-03',company:'OpenAI',companies:['OpenAI'],category:'acquisition',
   title:'OpenAI, Deployment Company 출범·Tomoro 인수 — FDE 150명 합류',
   description:'OpenAI가 기업의 AI 도입·운영을 지원하는 합작 법인 \\"OpenAI Deployment Company\\"를 19개 글로벌 투자·컨설팅사와 함께 출범(40억 달러+ 초기 투자, TPG 주도·Advent·Bain Capital·Brookfield 공동 창립 파트너). 동시에 런던 기반 응용 AI 컨설팅·엔지니어링 기업 Tomoro 인수 합의, 경험 많은 Forward Deployed Engineer(FDE)·배포 전문가 약 150명을 1일차부터 확보. FDE를 고객 조직에 상주시켜 핵심 워크플로우를 AI 중심으로 재설계하는 전략.',
   tags:['DeploymentCompany','Tomoro인수','FDE','엔터프라이즈','TPG'],source:'https://openai.com/index/openai-launches-the-deployment-company/'},
  {id:87,date:'2026-06-02',company:'Intel',companies:['Intel','NVIDIA','Samsung'],category:'infrastructure',
   title:'Intel, COMPUTEX 2026서 랙스케일 AI 인프라 공개 — SambaNova·Foxconn·Siemens 협력',
   description:'Intel이 COMPUTEX 2026에서 추론·에이전틱 워크로드 확장을 위한 Xeon 기반 랙스케일 AI 인프라를 발표. SambaNova SN-50 RDU와 결합해 비용·전력 효율을 높인 생산 준비 랙을 시연하고, Foxconn(시스템 통합)·Siemens(설계~제조 전 영역) 협력을 확대. Vista Equity·Cambium Capital이 설립한 Vector Core Compute는 Xeon·SambaNova RDU·NVIDIA Blackwell을 결합한 완전 분리형(disaggregated) 추론 클라우드를 공개.',
   tags:['COMPUTEX','랙스케일','Xeon','SambaNova','Foxconn'],source:'https://newsroom.intel.com/artificial-intelligence/intel-announces-new-ai-innovations-at-computex'},
  {id:88,date:'2026-06-04',company:'NVIDIA',companies:['NVIDIA'],category:'model',
   title:'NVIDIA Nemotron 3 Ultra 정식 배포 시작 — 550B 오픈웨이트 에이전트 모델',
   description:'NVIDIA가 Computex 2026(6/1)에서 공개한 오픈웨이트 프런티어 모델 Nemotron 3 Ultra를 6월 4일 Hugging Face·OpenRouter·build.nvidia.com에 NIM 마이크로서비스로 정식 배포. 총 550B 파라미터·토큰당 약 55B 활성 MoE 구조, 출력 속도 300+ tokens/s, 유사 프런티어 모델 대비 운영비 약 30% 절감. Artificial Analysis Intelligence Index 48점으로 미국 오픈웨이트 모델 중 최고 수준이나 중국 오픈모델(Kimi K2 등)에는 아직 뒤짐. Accenture·CrowdStrike·Palantir·Perplexity 등 초기 도입사 확인.',
   tags:['Nemotron3Ultra','오픈웨이트','MoE','550B','에이전트'],source:'https://nvidianews.nvidia.com/news/nvidia-debuts-nemotron-3-family-of-open-models'},
  {id:89,date:'2026-06-04',company:'Meta',companies:['Meta','Tesla'],category:'infrastructure',
   title:'Meta, 텐트형 데이터센터로 AI 인프라 가속 — 건설 기간 절반 단축',
   description:'Meta가 데이터센터 비용 절감을 위해 미국 오하이오 뉴올버니 등 캠퍼스에 대형 텐트(신속배치구조물, rapid deployment structures)를 세우고 수십억 달러 규모 칩을 투입, 오프그리드 터빈으로 전력을 공급. 4~6월 사이 12.5만 평방피트 규모 텐트 5~6동을 건설해 컴퓨트 구축 시간을 기존 2~3년에서 절반으로 단축. Tesla가 모델3 양산 당시 프리몬트 공장 주차장에 텐트를 세운 전략을 차용한 것으로, AI 인프라 증설 가속을 위한 Meta의 비용·속도 최적화 전략.',
   tags:['데이터센터','텐트','AI인프라','오프그리드','Meta'],source:'https://techcrunch.com/2026/06/04/meta-steals-a-tactic-from-tesla-and-builds-data-centers-in-tents/'},
  {id:90,date:'2026-06-05',company:'OpenAI',companies:['OpenAI'],category:'product',
   title:'OpenAI, ChatGPT 메모리 대규모 개편 "Dreaming" 공개 — 미국 Plus·Pro 우선 배포',
   description:'OpenAI가 6월 4일 블로그 "Dreaming: Better memory for a more helpful ChatGPT"를 통해 ChatGPT 메모리 시스템을 전면 재구축. 중요 맥락을 자동으로 합성·갱신하고, 사용자가 저장된 기억을 검토·수정·삭제할 수 있는 메모리 요약 페이지를 신설. 내부 평가에서 사실 회상 정확도 67.9%→82.8%, 선호 반영 55.3%→71.3%, 시간 경과 정확도 52.2%→75.1%로 개선. 약 5배 연산 절감으로 Plus·Pro 메모리 용량 2배 확대, 6월 5일 미국 Plus·Pro에 우선 배포 후 수주 내 Free·Go 및 추가 국가로 확대.',
   tags:['ChatGPT','메모리','Dreaming','개인화','OpenAI'],source:'https://www.neowin.net/news/openai-is-rolling-out-a-major-upgrade-to-chatgpt-memory/'},
  {id:91,date:'2026-06-02',company:'OpenAI',companies:['OpenAI','Figma'],category:'product',
   title:'OpenAI, Codex를 ChatGPT에 통합·역할별 비즈니스 플러그인 6종·Sites 출시',
   description:'OpenAI가 코딩 도구 Codex를 ChatGPT 앱 전반에 통합하고, 영업·데이터 분석·크리에이티브 제작·제품 디자인·상장주 투자·투자은행 등 역할별 비즈니스 플러그인 6종을 공개. 62개 업무 앱(Snowflake·Figma·Salesforce 등)과 110개 자동화 스킬을 기본 제공하며, 데이터 분석 플러그인은 Snowflake·Databricks·Hex·Tableau를 통합해 자연어 질의를 리포트로 변환. 자연어 입력을 웹 호스팅 사내 앱으로 만드는 Sites 기능도 Business·Enterprise 프리뷰로 출시. 비개발자가 주간 활성 사용자 500만 중 약 20%를 차지하며 엔지니어보다 3배 빠르게 도입.',
   tags:['Codex','비즈니스플러그인','Sites','엔터프라이즈','OpenAI'],source:'https://openai.com/index/codex-for-every-role-tool-workflow/'},
  {id:92,date:'2026-06-01',company:'OpenAI',companies:['OpenAI'],category:'regulation',
   title:'플로리다주, OpenAI·샘 올트먼 상대 첫 주(州) 차원 소송 — ChatGPT 안전 결함 주장',
   description:'플로리다주 법무장관이 6월 1일 하이랜즈 카운티 순회법원에 OpenAI와 CEO 샘 올트먼을 상대로 소송을 제기. 미국 주 정부 최초의 OpenAI 제소로, ChatGPT의 위험성을 경고하지 않고 아동을 포함한 사용자에게 안전하다고 마케팅했다고 주장. 플로리다 기만적·불공정거래법, 과실, 엄격책임, 사기적 표시, 공적 불법방해 등을 적용. 올트먼의 개인 책임도 적시하며 위반 건당 최대 1만 달러 민사벌금·금지명령·손해배상·부당이득 반환을 요구. ChatGPT 관련 피해 소송 20여 건과 맞물려 규제 압박이 가중.',
   tags:['규제','소송','플로리다','안전','OpenAI'],source:'https://techcrunch.com/2026/06/01/florida-sues-openai-sam-altman-in-first-of-its-kind-lawsuit-over-violent-incidents/'},
  {id:93,date:'2026-06-03',company:'Meta',companies:['Meta'],category:'product',
   title:'Meta, Business Agent 글로벌 출시 — WhatsApp·Instagram·Messenger 비즈니스 AI 에이전트',
   description:'Meta가 6월 3일 런던에서 열린 Conversations 2026 컨퍼런스에서 Meta Business Agent를 글로벌 출시. WhatsApp·Instagram·Messenger에서 고객 문의 응대, 비즈니스 카탈로그 기반 제품 추천, 예약 일정 관리, 잠재 고객 선별, 거래 완료까지 수행하며, 정해진 기준에 도달하면 실제 직원에게 넘기는 핸드오프 기능을 제공. 이미 100만+ 비즈니스가 WhatsApp·Messenger에서 24시간 응대에 활용 중. WhatsApp Business 앱·Instagram Pro·Messenger·Meta Business Suite에서 일부 비즈니스 대상 시작, 무료로 제공하되 향후 유료 구독으로 확대 예정. 마크 저커버그는 "모델이 발전하면 에이전트가 비즈니스 전체를 운영하게 될 것"이라고 언급.',
   tags:['BusinessAgent','WhatsApp','에이전트','비즈니스AI','Conversations'],source:'https://whatsappbusiness.com/blog/introducing-meta-business-agent-ai/'},
  {id:94,date:'2026-06-04',company:'Samsung',companies:['Samsung','OpenAI','Anthropic'],category:'infrastructure',
   title:'삼성 파운드리, OpenAI 커스텀 칩 협상 중단 후 Anthropic으로 선회',
   description:'삼성전자와 OpenAI의 ARM 기반 추론 NPU 커스텀 칩 공동 개발 협상이 전략적 이견으로 사실상 중단됐다는 보도가 잇따름. 삼성 파운드리는 미국 텍사스 테일러 공장의 2nm 양산 라인을 활용해 Anthropic을 차세대 고객으로 확보하려는 방향으로 선회. 삼성은 SK하이닉스 등과 함께 Anthropic 투자 라운드에 참여하며 "로직 칩"을 핵심 협력 분야로 명시, 업계는 향후 삼성 공장이 Anthropic 전용 하드웨어 생산에 쓰일 가능성을 주목. 다만 Anthropic은 파운드리 발주를 공식 확인하지 않았고, 양사 발표도 제조 약정 수준에는 미치지 못함.',
   tags:['파운드리','2nm','테일러','커스텀칩','로직칩'],source:'https://www.digitimes.com/news/a20260602VL217/samsung-foundry-anthropic-ai-soc-openai.html'},
  {id:95,date:'2026-06-05',company:'NVIDIA',companies:['NVIDIA','SK','LG','Naver','Samsung'],category:'partnership',
   title:'젠슨 황 방한 \\\'삼소맥 회동\\\' — 엔비디아 \"한국에 AI·로보틱스 연구센터 설립\"',
   description:'젠슨 황 엔비디아 CEO가 6월 5일 오후 서울 마포구 홍대입구 인근 삼겹살집에서 최태원 SK그룹 회장, 구광모 LG그룹 회장, 이해진 네이버 의장과 약 2시간 \\\'삼소맥(삼겹살+소맥)\\\' 회동. 황 CEO는 \"한국 파트너들이 매우 중요하다\"며 한국에 AI 연구 엔지니어·로보틱스 연구를 위한 R&D 센터를 구축 중이고 관련 인재를 채용하고 있다고 밝힘. 차세대 AI 플랫폼 \\\'베라 루빈\\\', 신규 CPU \\\'베라\\\', AI PC 플랫폼 \\\'RTX 스파크\\\', 로봇용 컴퓨팅 \\\'젯슨 토르\\\' 등을 소개. 8일에는 네이버·LG·현대차 본사를 잇달아 찾아 피지컬 AI·자율주행·로보틱스 협력을 논의할 예정.',
   tags:['젠슨황','방한','R&D센터','로보틱스','베라루빈'],source:'https://www.fnnews.com/news/202606052007518533'},
  {id:96,date:'2026-06-05',company:'OpenAI',companies:['OpenAI','Anthropic','Google','Microsoft'],category:'regulation',
   title:'OpenAI·Anthropic·Google·Microsoft CEO, 美 의회에 \"합성 DNA 스크리닝 의무화\" 공동 서한',
   description:'샘 올트먼(OpenAI)·다리오 아모데이(Anthropic)·데미스 허사비스(Google DeepMind)·무스타파 술레이만(Microsoft AI) 등 4대 AI 기업 수장이 6월 5일 미 의회에 합성 DNA 공급업체에 대한 바이오보안 스크리닝 의무화를 촉구하는 공동 서한에 서명. 과학자·국가안보 당국자·유전자합성기업 임원도 동참했으며, 합성 핵산 판매·제조 시 주문 서열 검증, 구매자 신원 확인, 거래 기록 보관을 법제화할 것을 요구. AI가 생물무기 제작의 기술적 장벽을 빠르게 낮추고 있다는 우려가 배경으로, Twist Bioscience·Ansa Biotechnologies 등 제조사도 서명하며 업계 일부가 규제를 환영.',
   tags:['바이오보안','합성DNA','생물무기','규제','공동서한'],source:'https://fortune.com/2026/06/05/openai-anthropic-microsoft-ceos-congress-bioweapon-safeguards/'},
  {id:97,date:'2026-06-08',company:'Apple',companies:['Apple','Google'],category:'partnership',
   title:'Apple WWDC 2026 — Gemini 기반 새 Siri·iOS 27 공개',
   description:'Apple이 6월 8일 WWDC 2026 키노트에서 Google Gemini로 구동되는 전면 재구축 Siri와 iOS 27을 공개. 블룸버그 보도에 따르면 Apple은 Siri 전용 1.2조 파라미터 커스텀 Gemini 모델 사용 대가로 Google에 연 약 10억 달러를 지불하며, 해당 모델은 Apple 실리콘 서버의 Private Cloud Compute에서 무상태(stateless)로 처리돼 사용자 데이터를 보존하지 않고 Google의 Gemini 재학습에도 쓰이지 않도록 계약. 새 Siri는 독립 앱·시스템 전역 \\\"Search or Ask\\\" 제스처·Dynamic Island 통합·챗봇형 인터페이스를 갖추고 이메일·사진·파일 등 개인 맥락 접근과 화면 인식·앱 간 액션을 지원. 서드파티 챗봇(ChatGPT·Claude 등) 연동도 개방.',
   tags:['WWDC','Siri','Gemini','iOS27','Apple','Google'],source:'https://www.macrumors.com/guide/wwdc-2026-what-to-expect/'},
  {id:98,date:'2026-06-04',company:'OpenAI',companies:['OpenAI'],category:'model',
   title:'OpenAI GPT-Rosalind 업데이트 — 생명과학·신약개발 프런티어 모델',
   description:'OpenAI가 생명과학 연구·신약개발에 특화된 프런티어 모델 GPT-Rosalind의 신규 업데이트를 공개. GPT-5.5의 에이전틱 코딩·툴 사용 능력에 의약화학·유전체학 등 핵심 도메인 지능을 결합해 전 영역에서 GPT-5.5를 능가하면서 토큰 사용은 절감(유전체학 분석 31% 토큰 절약). ChatGPT·Codex·API에서 신뢰 접근 프로그램 대상 리서치 프리뷰로 제공되며, Amgen·Moderna·Allen Institute·Thermo Fisher 등과 연구·발견 워크플로우에 적용 중.',
   tags:['GPT-Rosalind','생명과학','신약개발','유전체학','OpenAI'],source:'https://openai.com/index/introducing-new-capabilities-to-gpt-rosalind/'},
  {id:99,date:'2026-06-08',company:'OpenAI',companies:['OpenAI','Google','xAI','Anthropic'],category:'regulation',
   title:'美 국방부, Anthropic Claude 대체 위해 OpenAI·Google·xAI 모델 테스트',
   description:'미 국방부가 기밀 시스템 전반에서 Anthropic Claude를 대체하기 위해 OpenAI·Google·xAI 모델을 테스트 중이라는 보도가 6월 8일 다시 부각. Anthropic이 대량 감시·자율무기 사용에 대한 가드레일을 거두기를 거부하자, 국방장관 피트 헤그세스가 3월 Anthropic을 공급망 리스크로 지정한 직후 테스트가 시작됨. Claude는 기밀 네트워크의 주력 AI 공급자로 Maven Smart System에 통합돼 있었음. Anthropic은 해당 지정이 수십억 달러 매출 손실을 초래할 수 있다며 법정에서 다투는 중. 국방부 \\"파워유저\\" 25명의 선호도를 기준으로 후보 모델을 평가.',
   tags:['국방부','Pentagon','Claude대체','Maven','공급망리스크'],source:'https://www.techtimes.com/articles/317998/20260608/pentagon-racing-replace-anthropics-claude-because-it-was-too-safe-war.htm'},
  {id:100,date:'2026-06-09',company:'Anthropic',companies:['Anthropic'],category:'model',
   title:'Anthropic, Mythos급 최강 모델 Claude Fable 5 일반 공개',
   description:'Anthropic이 6월 9일 일반 사용자용으로 안전성을 확보한 Mythos급 모델 Claude Fable 5를 공개. Fable 5는 소프트웨어 엔지니어링·지식노동·비전·과학연구 등 거의 모든 벤치마크에서 SOTA(최첨단)를 기록하며 회사가 일반 출시한 모델 중 최강 성능. 6월 9일~22일 Pro·Max·Team·시트형 Enterprise 플랜에 무상 포함되고 API·사용량 기반 Enterprise에서는 즉시 제공. 가격은 입력 100만 토큰당 10달러, 출력 100만 토큰당 50달러로 Claude Mythos 프리뷰의 절반 미만. 일부 민감 주제 질의는 Claude Opus 4.8 응답으로 우회하는 보수적 세이프가드가 적용되며(평균 세션의 5% 미만에서 작동), 같은 모델에서 일부 가드레일을 해제한 Claude Mythos 5는 사이버방어·인프라 사업자 대상으로 美 정부와의 Project Glasswing을 통해 초기 배포.',
   tags:['ClaudeFable5','Mythos5','Anthropic','프런티어모델','Glasswing'],source:'https://www.anthropic.com/news/claude-fable-5-mythos-5'},
  {id:101,date:'2026-06-09',company:'OpenAI',companies:['OpenAI'],category:'acquisition',
   title:'OpenAI, SEC에 기밀 IPO 서류 제출 — 상장 절차 착수',
   description:'OpenAI가 6월 8일 미국 증권거래위원회(SEC)에 기밀 IPO 등록서류(S-1)를 제출하고 6월 9일 이를 공식 발표. Anthropic·SpaceX에 이어 상장 레이스에 합류한 것으로, 약 8,500억 달러(포스트머니 8,520억 달러) 안팎의 기업가치가 거론됨. OpenAI는 유출 가능성을 이유로 제출 사실을 선제적으로 공개했으며, AI 군비경쟁 속 대규모 자본 조달을 위한 월스트리트 데뷔의 문을 연 것으로 평가.',
   tags:['IPO','S-1','상장','OpenAI','자본조달'],source:'https://fortune.com/2026/06/09/openai-files-confidential-s-1-sec-ipo/'},
  {id:102,date:'2026-06-09',company:'NVIDIA',companies:['NVIDIA','Naver'],category:'infrastructure',
   title:'젠슨 황 네이버 1784 방문 — 네이버·엔비디아 기가와트급 AI 팩토리 동맹',
   description:'엔비디아 젠슨 황 CEO가 6월 8~9일 방한해 성남 네이버 1784를 찾아 이해진 네이버 창업자와 글로벌 AI 팩토리 구축에 합의. 네이버는 엔비디아 DSX 기반 AI 팩토리를 세워 2027년 상반기 55MW 가동을 시작하고 같은 해 100MW, 2028년 200MW까지 해외로 인프라를 확장하며 에이전트 AI·피지컬 AI 구동에 활용. 황 CEO는 SK·삼성·현대차 등 한국 기업과의 회동에 이어 네이버와 기가와트급 협력을 구체화하며 한국을 AI 패권의 핵심 거점으로 지목.',
   tags:['젠슨황','네이버','AI팩토리','엔비디아','DSX'],source:'https://zdnet.co.kr/view/?no=20260609173128'},
  {id:103,date:'2026-06-05',company:'Google',companies:['Google','SpaceX'],category:'infrastructure',
   title:'구글, 스페이스X에 월 9.2억 달러 컴퓨트 비용 지급 계약',
   description:'구글이 스페이스X에 2026년 10월부터 2029년 6월까지 매월 약 9억 2,000만 달러(총 약 330억 달러)를 지급하고 약 11만 개의 엔비디아 GPU와 CPU·메모리 등 컴퓨팅 자원에 접근하는 대규모 컴퓨트 계약을 맺은 것으로 6월 5일 보도됨. 빅테크가 부족한 AI 연산 능력을 확보하기 위해 일론 머스크의 스페이스X 인프라까지 끌어들이는 이례적 구도로, AI 컴퓨트 수요 폭증과 공급 병목을 단적으로 보여줌.',
   tags:['컴퓨트계약','GPU','데이터센터','구글','스페이스X'],source:'https://techcrunch.com/2026/06/05/google-will-pay-spacex-920m-per-month-for-compute/'},
  {id:104,date:'2026-06-11',company:'SpaceX',companies:['SpaceX'],category:'acquisition',
   title:'SpaceX, 6/11 IPO 공모가 확정 — 증시 사상 최대 규모 상장 임박',
   description:'SpaceX가 6월 11일 장 마감 후 IPO 공모가를 확정하고 6월 12일 나스닥에 티커 SPCX로 거래를 시작할 예정. 주당 약 135달러에 5억 5,660만 주를 공모해 약 750억 달러를 조달하고 약 1조 7,500억 달러의 기업가치를 목표로 함. 성사 시 2019년 사우디 아람코(294억 달러)를 2.5배 이상 뛰어넘는 증시 사상 최대 IPO가 됨. Anthropic·OpenAI에 이어 AI·우주 인프라 기업의 대형 상장 행렬이 이어지는 흐름.',
   tags:['IPO','SPCX','나스닥','SpaceX','상장'],source:'https://www.cnbc.com/2026/05/20/spacex-ipo-live-updates.html'},
  {id:105,date:'2026-06-11',company:'Samsung',companies:['Samsung','OpenAI','Google','Anthropic'],category:'product',
   title:'삼성전자 DX부문, 챗GPT·제미나이·클로드 공식 도입 — 6/12 시행·투트랙 AI 전략',
   description:'삼성전자 디바이스경험(DX)부문이 6월 12일부터 임직원 대상으로 OpenAI 챗GPT, 구글 제미나이 엔터프라이즈, 앤트로픽 클로드 등 외부 생성형 AI 3종을 공식 서비스로 개시. 4~5월 약 두 달간 임직원 2,500명 PoC 검증을 거침. 자체 모델 삼성 가우스를 고도화하면서 글로벌 빅테크 AI를 병행하는 투트랙 AI 전략을 본격화. 임직원이 업무 특성에 맞는 솔루션을 직접 선택해 조직 전반의 AI 전환(AX)을 가속하며, 보안 교육 이수자에 한해 사용 권한을 부여해 정보 유출 리스크를 관리.',
   tags:['삼성','생성형AI','AX','투트랙','삼성가우스'],source:'https://www.inews24.com/view/1975599'},
  {id:106,date:'2026-06-12',company:'SpaceX',companies:['SpaceX'],category:'acquisition',
   title:'SpaceX 나스닥 상장 데뷔 — 티커 SPCX, 증시 사상 최대 IPO',
   description:'SpaceX가 6월 12일 나스닥 글로벌 셀렉트 마켓과 나스닥 텍사스에서 티커 SPCX로 거래를 개시. 공모가는 주당 135달러로 약 5억 5,560만 주를 매각해 약 750억 달러를 조달했고, 약 13.1억 주 기준 약 1조 7,700억 달러의 기업가치로 역대 최대 규모 IPO를 기록. 총수요가 2,500억 달러를 넘고 개인 청약만 1,000억 달러를 상회해 약 3.5~4배 초과 청약. Anthropic·OpenAI의 상장 행렬에 이어 AI·우주 인프라 대형 상장이 이어지는 흐름으로, 첫날 거래는 변동성에 따른 다수의 매매 정지가 예상됨.',
   tags:['IPO','SPCX','나스닥','SpaceX','상장데뷔'],source:'https://www.tradingkey.com/analysis/stocks/us-stocks/261960721-spacex-ipo-is-live-at-135-bull-base-and-bear-cases-for-the-first-90-days-tradingkey'},
  {id:107,date:'2026-06-12',company:'OpenAI',companies:['OpenAI','Samsung','Naver','Kakao'],category:'partnership',
   title:'샘 올트먼 방한 연기 — 삼성·네이버·카카오 회동 무산',
   description:'오픈AI가 6월 12일 샘 올트먼 CEO의 6월 14~15일 방한 일정을 개인 사정을 이유로 연기한다고 밝히면서 삼성전자·네이버·카카오와 예정됐던 연쇄 회동이 모두 순연됨. 올트먼은 삼성전자 디지털시티 DX 인사이트 토크 참석과 전영현 DS부문장·노태문 DX부문장 직무대행 면담, 15일 카카오 판교아지트에서 정신아 대표와 카카오톡·챗GPT 연계 강화 협의, 네이버와의 회동을 계획했었음. 젠슨 황 엔비디아 CEO 방한(6/8~9)에 이은 빅테크 수장의 방한 행렬로 주목됐으나 8개월 만의 방한이 무산. 오픈AI는 한국이 전략적으로 매우 중요한 파트너이며 국내 파트너와의 협력은 예정대로 이어진다고 밝힘.',
   tags:['올트먼','방한연기','OpenAI','삼성','네이버','카카오'],source:'https://www.news1.kr/it-science/internet-platform/6195987'},
  {id:108,date:'2026-06-14',company:'OpenAI',companies:['OpenAI'],category:'partnership',
   title:'OpenAI, 글로벌 파트너 네트워크 출범 — 1.5억 달러 투자',
   description:'OpenAI가 6월 14일 기업의 AI 도입·구축·확장을 지원하는 글로벌 생태계 \'OpenAI 파트너 네트워크\'를 공식 출범하고 1억 5,000만 달러를 투자한다고 발표. 외부 컨설팅·기술 기업을 끌어들여 기업의 AI 제품 채택을 가속하는 두 번째 트랙으로, Select·Advanced·Elite 3개 등급으로 운영되며 영업 실적·기술 역량·공동 영업·배포 경험에 따라 승급. 2026년 말까지 30만 명의 공인 컨설턴트 양성을 목표로 하고, Elite 파트너에는 OpenAI 엔지니어가 현장 교육하는 Forward Deployed Experts 파일럿을 제공. 출범 파트너로 액센추어·베인·BCG·맥킨지·PwC 등이 합류.',
   tags:['파트너네트워크','엔터프라이즈AI','OpenAI','컨설팅','AX'],source:'https://openai.com/index/introducing-openai-partner-network/'},
  {id:109,date:'2026-06-15',company:'OpenAI',companies:['OpenAI','Anthropic','Google'],category:'regulation',
   title:'AI 3대 수장, G7 정상회의 첫 동반 참석 — AI 정책 논의',
   description:'OpenAI 샘 올트먼, Anthropic 다리오 아모데이, 구글 딥마인드 데미스 허사비스가 6월 15~17일 프랑스 에비앙레뱅에서 열리는 G7 정상회의에 나란히 참석. 세 경쟁사 수장이 세계 정상들 앞에 함께 모습을 드러내는 것은 처음으로, 마크롱 대통령이 올트먼을 직접 초청. 정상회의는 안전하고 신속하며 효과적인 AI 배포 방안을 논의하는 별도의 비즈니스 리더 오찬을 마련하는 등 AI를 핵심 의제로 다룸. 세 CEO가 최근 합성 DNA·AI 생물학 위협 규제 강화를 촉구하는 공동 서한에 서명한 직후의 행보로, 경쟁사 간 보기 드문 정책 공조로 평가.',
   tags:['G7','AI정책','규제','올트먼','아모데이','허사비스'],source:'https://www.bloomberg.com/news/articles/2026-06-12/anthropic-openai-google-executives-plan-to-attend-g7-summit'},
  {id:110,date:'2026-06-08',company:'SK',companies:['SK','NVIDIA'],category:'partnership',
   title:'SK텔레콤·엔비디아, 글로벌 \'풀스택 AI 클라우드\' 동맹 — GW급 AI 팩토리',
   description:'최태원 SK그룹 회장과 젠슨 황 엔비디아 CEO가 6월 8일 서울 서린사옥에서 만나 AI 인프라 전방위 협력에 합의. SK텔레콤이 엔비디아의 풀스택 레퍼런스 아키텍처 \'DSX 플랫폼\'(소프트웨어·하드웨어·운영 통합)을 채택해 글로벌 시장을 겨냥한 대규모 AI 클라우드를 구축하기로 함. SKT는 엔비디아 클라우드 파트너 프로그램에 합류해 블랙웰 GPU와 차세대 베라 루빈 플랫폼 기반 AI 학습·추론 서비스를 제공하고, 2027년 국내 첫 기가와트급 AI 팩토리를 가동한 뒤 아시아 전역으로 사업을 확장할 계획. 칩부터 데이터센터 운영까지 아우르는 풀스택 동맹으로 SK는 아시아 AI 인프라 주도권 확보를 노림.',
   tags:['SK텔레콤','엔비디아','풀스택AI클라우드','DSX','AI팩토리'],source:'https://www.fnnews.com/news/202606080835426323'},
  {id:111,date:'2026-06-15',company:'Samsung',companies:['Samsung','Tesla'],category:'partnership',
   title:'삼성 파운드리, 머스크 뉴럴링크 차세대 뇌이식칩 첫 수주',
   description:'삼성전자 파운드리 사업부가 일론 머스크의 뉴럴링크 4세대 뇌-컴퓨터 인터페이스(BCI) 이식용 칩을 4나노 공정으로 개발 중인 것으로 6월 15일 확인됨. 뉴럴링크 칩 수주는 이번이 처음으로, 2027년 상반기 테스트 칩 출하 후 이르면 2027년 말 양산이 가능할 전망. 삼성은 이미 테슬라(차세대 자율주행 칩)·엔비디아(HBM4·4나노 추론칩)·구글 물량을 확보한 데 이어 머스크 생태계와의 협력을 BCI 영역까지 확대하며, 적자에 빠진 파운드리 사업의 2028년 흑자 전환 발판으로 삼으려는 행보로 평가됨.',
   tags:['삼성파운드리','뉴럴링크','BCI','4나노','머스크','테슬라'],source:'https://www.hankyung.com/article/2026061577071'},
  {id:112,date:'2026-06-11',company:'OpenAI',companies:['OpenAI'],category:'acquisition',
   title:'OpenAI, 클라우드 실행 플랫폼 Ona 인수 — Codex 강화',
   description:'OpenAI가 6월 11일 AI 에이전트용 클라우드 실행·오케스트레이션 플랫폼 Ona(구 Gitpod)를 인수한다고 발표. Ona의 보안 클라우드 실행 기술을 코딩 어시스턴트 Codex 생태계에 통합해, 장시간 지속되는 영구 작업 수행과 기업의 에이전트 프로덕션 배포를 지원. Codex 주간 사용자는 500만 명을 돌파하며 연초 대비 400% 증가. 인수 금액은 비공개이며 통상적 종결 조건 충족 시 마무리될 예정.',
   tags:['인수','Ona','Codex','AI에이전트','클라우드','OpenAI'],source:'https://openai.com/index/openai-to-acquire-ona/'},

function renderCal(){
  const months=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('cal-lbl').textContent=`${cy}년 ${months[cm]}`;
  const mev=fe().filter(e=>{const d=new Date(e.date+'T00:00:00');return d.getFullYear()===cy&&d.getMonth()===cm;});
  document.getElementById('cal-stat').textContent=`${mev.length}개 이슈`;
  const firstDow=new Date(cy,cm,1).getDay();
  const dim=new Date(cy,cm+1,0).getDate();
  const today=new Date();
  const dows=['일','월','화','수','목','금','토'];
  let h=dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<firstDow;i++)h+=`<div class="cal-day empty"></div>`;
  for(let day=1;day<=dim;day++){
    const s=ds(cy,cm,day);
    const devs=mev.filter(e=>e.date===s);
    const isT=today.getFullYear()===cy&&today.getMonth()===cm&&today.getDate()===day;
    const isSel=selDate===s;
    const dow=(firstDow+day-1)%7;
    const isW=dow===0||dow===6;
    const hasSelCo=selCoFilter&&devs.some(e=>(e.companies||[e.company]).includes(selCoFilter));
    let cls='cal-day'+(isT?' today':'')+(isSel?' selected':'')+(isW?' wknd':'')+(hasSelCo?' co-highlight':'');
    const num=isT?`<div class="dnum"><span class="today-c">${day}</span></div>`:`<div class="dnum">${day}</div>`;
    const pills=devs.slice(0,3).map(e=>{
      const co=(e.companies||[e.company])[0];
      const bg=CO_COLORS[co]||'#6366f1';
      return`<div class="epill" style="background:${bg}"><div class="epill-dot"></div><span class="epill-txt">${e.title}</span></div>`;
    }).join('');
    const more=devs.length>3?`<div class="more-cnt">+${devs.length-3}개</div>`:'';
    h+=`<div class="${cls}" onclick="selDate_('${s}')">${num}${pills}${more}</div>`;
  }
  document.getElementById('cal-grid').innerHTML=h;
}

// ═══════════════════════════════════════
// MIND MAP — Canvas Physics
// ═══════════════════════════════════════
function initMindMap(){
  mmReady=true;
  const canvas=document.getElementById('mm-canvas');
  const wrap=canvas.parentElement;
  canvas.width=wrap.clientWidth;
  canvas.height=wrap.clientHeight;
  const W=canvas.width,H=canvas.height;
  const cx=W/2,cy=H/2;

  // ── 회사 노드: 고정 링 배치 (순수 기하학, 물리 없음) ──
  // 각도: 0°=오른쪽, 90°=아래(캔버스), 270°=위
  const D2R=Math.PI/180;
  const R=250; // 고정 반경 (auto-fit이 화면에 맞게 줌 조정)

  // 그룹별 호(arc): 15° 간격, 노드수 비례 배분 (총 360°)
  // bigtech=68°, hw=22°, korea=57°, creative=68°, other=22°, ai-lab=35° + 15°×6=90° → 362°≈360°
  // 시작: bigtech 중심 270°(꼭대기) → s=270-34=236°
  const GRP_ARC={
    'bigtech': {s:236, e:304},  // 236~304° (중심 270°=위)
    'hw':      {s:319, e:341},  // 319~341° (우상단)
    'korea':   {s:356, e:413},  // 356~413° (오른쪽→우하단, 0° 경계 통과)
    'creative':{s: 68, e:136},  // 68~136°  (아래)
    'other':   {s:151, e:173},  // 151~173° (좌하단)
    'ai-lab':  {s:188, e:223},  // 188~223° (왼쪽~좌상단)
  };

  const grpNodes={};
  MM_NODES.forEach(n=>{if(n.grp!=='topic')(grpNodes[n.grp]=grpNodes[n.grp]||[]).push(n);});

  const posMap={};
  Object.entries(grpNodes).forEach(([grp,nodes])=>{
    const arc=GRP_ARC[grp];if(!arc)return;
    nodes.forEach((n,i)=>{
      const t=nodes.length===1?0.5:i/(nodes.length-1);
      const deg=arc.s+(arc.e-arc.s)*t;
      posMap[n.id]={x:cx+Math.cos(deg*D2R)*R, y:cy+Math.sin(deg*D2R)*R};
    });
  });

  // ── 주제 노드: 부모 방향으로 R×1.45, 같은 부모묶음은 부채꼴 ──
  const topicNodes=MM_NODES.filter(n=>n.grp==='topic');
  const byParent={};
  topicNodes.forEach(n=>{
    const links=MM_LINKS.filter(l=>l.s===n.id||l.t===n.id);
    const parents=links.map(l=>l.s===n.id?l.t:l.s).filter(id=>posMap[id]);
    const key=parents.slice().sort().join('|');
    (byParent[key]=byParent[key]||{parents,items:[]}).items.push(n);
  });
  Object.values(byParent).forEach(({parents,items})=>{
    const ax=parents.length?parents.reduce((s,id)=>s+posMap[id].x,0)/parents.length:cx;
    const ay=parents.length?parents.reduce((s,id)=>s+posMap[id].y,0)/parents.length:cy;
    const base=Math.atan2(ay-cy,ax-cx);
    const count=items.length;
    const span=Math.min(0.50,count*0.20);
    items.forEach((n,i)=>{
      const a=count===1?base:base+(i/(count-1)-0.5)*span;
      posMap[n.id]={x:cx+Math.cos(a)*R*1.45, y:cy+Math.sin(a)*R*1.45};
    });
  });

  mmNodes=MM_NODES.map(n=>{
    const p=posMap[n.id]||{x:cx,y:cy};
    return{...n,x:p.x,y:p.y,vx:0,vy:0,pinned:n.grp!=='topic'};
  });
  mmLinks=MM_LINKS.map(l=>({...l,
    sn:mmNodes.find(n=>n.id===l.s),
    tn:mmNodes.find(n=>n.id===l.t)
  })).filter(l=>l.sn&&l.tn);

  setupCanvasEvents(canvas);

  // ── Auto-fit: 모든 노드가 화면에 맞도록 초기 줌/오프셋 ──
  const pad=40;
  const xs=mmNodes.map(n=>n.x), ys=mmNodes.map(n=>n.y);
  const minX=Math.min(...xs)-pad, maxX=Math.max(...xs)+pad;
  const minY=Math.min(...ys)-pad, maxY=Math.max(...ys)+pad;
  const fw=maxX-minX, fh=maxY-minY;
  mmScale=Math.min(1.0,(W*0.96)/fw,(H*0.96)/fh);
  mmOffset.x=(W-fw*mmScale)/2-minX*mmScale;
  mmOffset.y=(H-fh*mmScale)/2-minY*mmScale;

  // 물리 완전 비활성화 — 순수 기하학 배치로 항상 안정
  mmAlpha=0.002;
  mmAnimating=true;
  animate(canvas);
}

let mmAlpha=1;
function tick(W,H){
  // 물리는 거의 꺼진 상태 — 드래그 시 주변 노드 살짝 밀기만
  if(mmAlpha<0.001||!mmDragging)return;
  const nodes=mmNodes;
  for(let j=0;j<nodes.length;j++){
    const B=nodes[j];
    if(B===mmDragging||B.pinned)continue;
    const dx=B.x-mmDragging.x,dy=B.y-mmDragging.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    const minD=mmDragging.sz+B.sz+18;
    if(d<minD){
      const f=(minD-d)*0.25;
      B.vx+=dx/d*f;B.vy+=dy/d*f;
    }
  }
  nodes.forEach(n=>{
    if(n===mmDragging||n.pinned)return;
    n.vx*=0.65;n.vy*=0.65;
    n.x+=n.vx;n.y+=n.vy;
  });
}

function draw(canvas){
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(mmOffset.x,mmOffset.y);
  ctx.scale(mmScale,mmScale);

  // Links
  mmLinks.forEach(l=>{
    const A=l.sn,B=l.tn;
    const dx=B.x-A.x,dy=B.y-A.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
    const ex=B.x-dx/dist*(B.sz+6),ey=B.y-dy/dist*(B.sz+6);
    ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(ex,ey);
    ctx.strokeStyle=REL_COLORS[l.rel]||'#aaa';
    ctx.globalAlpha=0.4;ctx.lineWidth=1.4;ctx.stroke();
    const ang=Math.atan2(dy,dx);
    ctx.beginPath();ctx.moveTo(ex,ey);
    ctx.lineTo(ex-8*Math.cos(ang-0.4),ey-8*Math.sin(ang-0.4));
    ctx.lineTo(ex-8*Math.cos(ang+0.4),ey-8*Math.sin(ang+0.4));
    ctx.closePath();ctx.fillStyle=REL_COLORS[l.rel]||'#aaa';ctx.globalAlpha=0.5;ctx.fill();
    ctx.globalAlpha=1;
    // 라벨: hover 시만
    if(mmHovered&&(mmHovered===l.sn||mmHovered===l.tn)){
      const mx=(A.x+ex)/2,my=(A.y+ey)/2;
      ctx.font='7px sans-serif';ctx.fillStyle='#9090b0';
      ctx.textAlign='center';ctx.fillText(l.type,mx,my-2);
    }
  });

  // Nodes
  mmNodes.forEach(n=>{
    const isH=mmHovered===n;
    const r=n.sz+(isH?3:0);
    const col=NODE_COLORS[n.id]||GRP_COLORS[n.grp]||'#6366f1';
    const isTopic=n.grp==='topic';
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);
    ctx.fillStyle=isTopic?col+'30':col+(isH?'ff':'cc');
    ctx.fill();
    ctx.strokeStyle=col;
    ctx.lineWidth=isTopic?1.5:2;
    ctx.stroke();
    // Label
    const lines=n.label.split('\n');
    ctx.font=`${n.sz>18?10:8}px sans-serif`;
    ctx.fillStyle='#1a1a30';ctx.textAlign='center';
    lines.forEach((line,i)=>{ctx.fillText(line,n.x,n.y+r+(i+1)*11);});
  });
  ctx.restore();
}

function animate(canvas){
  if(!mmAnimating)return;
  tick(canvas.width,canvas.height);
  draw(canvas);
  requestAnimationFrame(()=>animate(canvas));
}
function startAnim(){
  mmAnimating=true;
  const canvas=document.getElementById('mm-canvas');
  animate(canvas);
}

function toGraph(cx,cy,canvas){
  const rect=canvas.getBoundingClientRect();
  return{x:(cx-rect.left-mmOffset.x)/mmScale,y:(cy-rect.top-mmOffset.y)/mmScale};
}
function hitNode(gx,gy){return mmNodes.find(n=>{const dx=n.x-gx,dy=n.y-gy;return Math.sqrt(dx*dx+dy*dy)<=n.sz+5;});}

function setupCanvasEvents(canvas){
  let lastMx=0,lastMy=0,panning=false,panStart={x:0,y:0},panOff={x:0,y:0};
  let mouseDownX=0,mouseDownY=0,dragMoved=false;

  canvas.addEventListener('mousedown',e=>{
    const g=toGraph(e.clientX,e.clientY,canvas);
    const n=hitNode(g.x,g.y);
    mouseDownX=e.clientX;mouseDownY=e.clientY;dragMoved=false;
    if(n){mmDragging=n;} // alpha는 실제 드래그 이동 시에만 올림
    else{panning=true;panStart={x:e.clientX,y:e.clientY};panOff={x:mmOffset.x,y:mmOffset.y};}
  });
  canvas.addEventListener('mousemove',e=>{
    if(mmDragging){
      // 최소 4px 이상 움직여야 드래그로 인정 (클릭과 구분)
      if(!dragMoved){
        const dx=e.clientX-mouseDownX,dy=e.clientY-mouseDownY;
        if(Math.abs(dx)>4||Math.abs(dy)>4){
          dragMoved=true;
          // pinned 노드는 드래그 중에만 임시 unpin
          if(mmDragging&&mmDragging.pinned)mmDragging._wasPin=true;
        }
      }
      if(dragMoved){
        const g=toGraph(e.clientX,e.clientY,canvas);
        mmDragging.x=g.x;mmDragging.y=g.y;
      }
    } else if(panning){
      mmOffset.x=panOff.x+(e.clientX-panStart.x);
      mmOffset.y=panOff.y+(e.clientY-panStart.y);
    } else {
      const g=toGraph(e.clientX,e.clientY,canvas);
      const n=hitNode(g.x,g.y);
      mmHovered=n||null;
      canvas.style.cursor=n?'pointer':'default';
      if(n){
        const tt=document.getElementById('tooltip');
        const cnt=EVENTS.filter(ev=>(ev.companies||[ev.company]).includes(n.id)).length;
        const lnk=mmLinks.filter(l=>l.s===n.id||l.t===n.id).length;
        tt.innerHTML=`<h4>${n.label.replace('\n',' ')}</h4><p>연결: ${lnk}건${cnt?`<br>관련 이슈: ${cnt}건`:''}${n.grp!=='topic'?'<br><span style="color:#6366f1">더블클릭 → 캘린더 이동</span>':''}</p>`;
        tt.style.display='block';tt.style.left=(e.clientX+12)+'px';tt.style.top=(e.clientY-36)+'px';
      } else document.getElementById('tooltip').style.display='none';
    }
    lastMx=e.clientX;lastMy=e.clientY;
  });
  canvas.addEventListener('mouseup',()=>{
    if(mmDragging&&mmDragging._wasPin){
      mmDragging.pinned=true; // 드롭 후 다시 고정
      mmDragging._wasPin=false;
      mmDragging.vx=0;mmDragging.vy=0;
    }
    mmDragging=null;panning=false;dragMoved=false;
  });
  canvas.addEventListener('mouseleave',()=>{mmDragging=null;panning=false;document.getElementById('tooltip').style.display='none';});
  // 클릭 시 캘린더 강제 이동 제거 — 더블클릭으로만 이동
  canvas.addEventListener('dblclick',e=>{
    const g=toGraph(e.clientX,e.clientY,canvas);
    const n=hitNode(g.x,g.y);
    if(n&&n.grp!=='topic'){
      const rel=EVENTS.filter(ev=>(ev.companies||[ev.company]).includes(n.id));
      if(rel.length){const lat=[...rel].sort((a,b)=>b.date.localeCompare(a.date))[0];jumpTo(lat.date);}
    }
  });
  canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    const factor=e.deltaY<0?1.12:0.89;
    mmOffset.x=mx-(mx-mmOffset.x)*factor;
    mmOffset.y=my-(my-mmOffset.y)*factor;
    mmScale=Math.max(0.2,Math.min(4,mmScale*factor));
  },{passive:false});
}

function mmZoomIn(){const canvas=document.getElementById('mm-canvas');const W=canvas.width,H=canvas.height;mmOffset.x=W/2-(W/2-mmOffset.x)*1.25;mmOffset.y=H/2-(H/2-mmOffset.y)*1.25;mmScale=Math.min(4,mmScale*1.25);}
function mmZoomOut(){const canvas=document.getElementById('mm-canvas');const W=canvas.width,H=canvas.height;mmOffset.x=W/2-(W/2-mmOffset.x)*0.8;mmOffset.y=H/2-(H/2-mmOffset.y)*0.8;mmScale=Math.max(0.2,mmScale*0.8);}
function mmReset(){
  const canvas=document.getElementById('mm-canvas');
  if(!mmNodes.length)return;
  const W=canvas.width,H=canvas.height,pad=40;
  const xs=mmNodes.map(n=>n.x),ys=mmNodes.map(n=>n.y);
  const minX=Math.min(...xs)-pad,maxX=Math.max(...xs)+pad;
  const minY=Math.min(...ys)-pad,maxY=Math.max(...ys)+pad;
  const fw=maxX-minX,fh=maxY-minY;
  mmScale=Math.min(1.0,(W*0.96)/fw,(H*0.96)/fh);
  mmOffset.x=(W-fw*mmScale)/2-minX*mmScale;
  mmOffset.y=(H-fh*mmScale)/2-minY*mmScale;
}

// PEOPLE TAB RENDERING
// ═══════════════════════════════════════
const PPL_GRP_ORDER = ['ai-lab','bigtech','hw','korea','creative'];
let selCo = null;

function renderPplList(){
  const grouped = {};
  PPL_GRP_ORDER.forEach(g=>grouped[g]=[]);
  COMPANY_PROFILES.forEach(c=>{if(grouped[c.grp])grouped[c.grp].push(c);});
  let h='';
  PPL_GRP_ORDER.forEach(g=>{
    if(!grouped[g].length)return;
    h+=`<div class="ppl-grp-lbl">${GRP_LABELS[g]||g}</div>`;
    grouped[g].forEach(c=>{
      const col=CO_COLORS[c.id]||'#6366f1';
      const isSel=selCo===c.id;
      h+=`<button class="ppl-co-btn${isSel?' sel':''}" onclick="selectCo('${c.id}')">
        <div class="ppl-co-dot" style="background:${col}"></div>
        <span class="ppl-co-name">${c.id}</span>
      </button>`;
    });
  });
  document.getElementById('ppl-list').innerHTML=h;
  if(!selCo&&COMPANY_PROFILES.length)selectCo(COMPANY_PROFILES[0].id);
}

function selectCo(id){
  selCo=id;
  // update list selection
  document.querySelectorAll('.ppl-co-btn').forEach(b=>{
    b.classList.toggle('sel',b.textContent.trim()===id);
  });
  const co=COMPANY_PROFILES.find(c=>c.id===id);
  if(!co)return;
  const col=CO_COLORS[id]||'#6366f1';
  const grpLabel=GRP_LABELS[co.grp]||co.grp;
  const icon=CO_ICONS[id]||'🏢';
  // Related moves
  const moves=TALENT_MOVES.filter(m=>m.from.includes(id)||m.to.includes(id));

  const peopleHtml=co.people.map(p=>`
    <div class="person-card">
      <div class="person-name">${p.name}</div>
      <div class="person-role">${p.role}</div>
      <div class="person-note">${p.note}</div>
    </div>`).join('');

  const movesHtml=moves.length?moves.map(m=>{
    const dir=m.from.includes(id)?'출발':'합류';
    const badge=dir==='출발'
      ?`<span style="background:#ef4444;color:#fff;font-size:8px;padding:1px 5px;border-radius:3px;margin-left:5px">퇴사/이탈</span>`
      :`<span style="background:#10b981;color:#fff;font-size:8px;padding:1px 5px;border-radius:3px;margin-left:5px">합류</span>`;
    return`<div class="move-card">
      <div class="move-yr">${m.year}</div>
      <div class="move-body">
        <div class="move-person">${m.person}${badge}</div>
        <div class="move-path"><span>${m.from}</span><span class="arr">→</span><span>${m.to}</span></div>
        <div class="move-note">${m.note}</div>
      </div>
    </div>`;}).join('')
    :`<div style="color:var(--text3);font-size:11px;padding:10px 0">기록된 인재 이동 없음</div>`;

  document.getElementById('ppl-main').innerHTML=`
    <div class="co-hdr">
      <div class="co-icon" style="background:${col}22;border:2px solid ${col}44">${icon}</div>
      <div class="co-hdr-meta">
        <h2>${co.id}</h2>
        <div class="co-pills">
          <span class="co-grp-pill" style="background:${col}">${grpLabel}</span>
          <span class="co-info-pill">설립 ${co.founded}</span>
          <span class="co-info-pill">📍 ${co.hq}</span>
          ${co.valuation?`<span class="co-info-pill">💰 ${co.valuation}</span>`:''}
          <span class="co-ceo-pill">👤 ${co.ceo}</span>
        </div>
      </div>
    </div>
    <div class="co-desc">${co.desc}</div>
    <div class="sec-title">주요 제품 / 서비스</div>
    <div class="prod-wrap">${co.products.map(p=>`<span class="prod-chip">${p}</span>`).join('')}</div>
    <div class="sec-title">핵심 인물</div>
    <div class="ppl-grid">${peopleHtml}</div>
    <div class="sec-title">인재 이동 내역</div>
    <div class="moves-list">${movesHtml}</div>
    <div style="height:30px"></div>
  `;
}
