// ═══════════════════════════════════════
// MIND MAP — Canvas Physics
// ═══════════════════════════════════════
function initMindMap(){
  mmReady=true;
  const canvas=document.getElementById('mm-canvas');
  const wrap=canvas.parentElement;
  canvas.width=wrap.clientWidth;
  canvas.height=wrap.clientHeight;
  const W=canvas.width,H=canvas.height;
  const cx=W/2,cy=H/2;

  // ── 회사 노드: 고정 링 배치 (순수 기하학, 물리 없음) ──
  // 각도: 0°=오른쪽, 90°=아래(캔버스), 270°=위
  const D2R=Math.PI/180;
  const R=250; // 고정 반경 (auto-fit이 화면에 맞게 줌 조정)

  // 그룹별 호(arc): 15° 간격, 노드수 비례 배분 (총 360°)
  // bigtech=68°, hw=22°, korea=57°, creative=68°, other=22°, ai-lab=35° + 15°×6=90° → 362°≈360°
  // 시작: bigtech 중심 270°(꼭대기) → s=270-34=236°
  const GRP_ARC={
    'bigtech': {s:236, e:304},  // 236~304° (중심 270°=위)
    'hw':      {s:319, e:341},  // 319~341° (우상단)
    'korea':   {s:356, e:413},  // 356~413° (오른쪽→우하단, 0° 경계 통과)
    'creative':{s: 68, e:136},  // 68~136°  (아래)
    'other':   {s:151, e:173},  // 151~173° (좌하단)
    'ai-lab':  {s:188, e:223},  // 188~223° (왼쪽~좌상단)
  };

  const grpNodes={};
  MM_NODES.forEach(n=>{if(n.grp!=='topic')(grpNodes[n.grp]=grpNodes[n.grp]||[]).push(n);});

  const posMap={};
  Object.entries(grpNodes).forEach(([grp,nodes])=>{
    const arc=GRP_ARC[grp];if(!arc)return;
    nodes.forEach((n,i)=>{
      const t=nodes.length===1?0.5:i/(nodes.length-1);
      const deg=arc.s+(arc.e-arc.s)*t;
      posMap[n.id]={x:cx+Math.cos(deg*D2R)*R, y:cy+Math.sin(deg*D2R)*R};
    });
  });

  // ── 주제 노드: 부모 방향으로 R×1.45, 같은 부모묶음은 부채꼴 ──
  const topicNodes=MM_NODES.filter(n=>n.grp==='topic');
  const byParent={};
  topicNodes.forEach(n=>{
    const links=MM_LINKS.filter(l=>l.s===n.id||l.t===n.id);
    const parents=links.map(l=>l.s===n.id?l.t:l.s).filter(id=>posMap[id]);
    const key=parents.slice().sort().join('|');
    (byParent[key]=byParent[key]||{parents,items:[]}).items.push(n);
  });
  Object.values(byParent).forEach(({parents,items})=>{
    const ax=parents.length?parents.reduce((s,id)=>s+posMap[id].x,0)/parents.length:cx;
    const ay=parents.length?parents.reduce((s,id)=>s+posMap[id].y,0)/parents.length:cy;
    const base=Math.atan2(ay-cy,ax-cx);
    const count=items.length;
    const span=Math.min(0.50,count*0.20);
    items.forEach((n,i)=>{
      const a=count===1?base:base+(i/(count-1)-0.5)*span;
      posMap[n.id]={x:cx+Math.cos(a)*R*1.45, y:cy+Math.sin(a)*R*1.45};
    });
  });

  mmNodes=MM_NODES.map(n=>{
    const p=posMap[n.id]||{x:cx,y:cy};
    return{...n,x:p.x,y:p.y,vx:0,vy:0,pinned:n.grp!=='topic'};
  });
  mmLinks=MM_LINKS.map(l=>({...l,
    sn:mmNodes.find(n=>n.id===l.s),
    tn:mmNodes.find(n=>n.id===l.t)
  })).filter(l=>l.sn&&l.tn);

  setupCanvasEvents(canvas);

  // ── Auto-fit: 모든 노드가 화면에 맞도록 초기 줌/오프셋 ──
  const pad=40;
  const xs=mmNodes.map(n=>n.x), ys=mmNodes.map(n=>n.y);
  const minX=Math.min(...xs)-pad, maxX=Math.max(...xs)+pad;
  const minY=Math.min(...ys)-pad, maxY=Math.max(...ys)+pad;
  const fw=maxX-minX, fh=maxY-minY;
  mmScale=Math.min(1.0,(W*0.96)/fw,(H*0.96)/fh);
  mmOffset.x=(W-fw*mmScale)/2-minX*mmScale;
  mmOffset.y=(H-fh*mmScale)/2-minY*mmScale;

  // 물리 완전 비활성화 — 순수 기하학 배치로 항상 안정
  mmAlpha=0.002;
  mmAnimating=true;
  animate(canvas);
}

let mmAlpha=1;
function tick(W,H){
  // 물리는 거의 꺼진 상태 — 드래그 시 주변 노드 살짝 밀기만
  if(mmAlpha<0.001||!mmDragging)return;
  const nodes=mmNodes;
  for(let j=0;j<nodes.length;j++){
    const B=nodes[j];
    if(B===mmDragging||B.pinned)continue;
    const dx=B.x-mmDragging.x,dy=B.y-mmDragging.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    const minD=mmDragging.sz+B.sz+18;
    if(d<minD){
      const f=(minD-d)*0.25;
      B.vx+=dx/d*f;B.vy+=dy/d*f;
    }
  }
  nodes.forEach(n=>{
    if(n===mmDragging||n.pinned)return;
    n.vx*=0.65;n.vy*=0.65;
    n.x+=n.vx;n.y+=n.vy;
  });
}

function draw(canvas){
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(mmOffset.x,mmOffset.y);
  ctx.scale(mmScale,mmScale);

  // Links
  mmLinks.forEach(l=>{
    const A=l.sn,B=l.tn;
    const dx=B.x-A.x,dy=B.y-A.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
    const ex=B.x-dx/dist*(B.sz+6),ey=B.y-dy/dist*(B.sz+6);
    ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(ex,ey);
    ctx.strokeStyle=REL_COLORS[l.rel]||'#aaa';
    ctx.globalAlpha=0.4;ctx.lineWidth=1.4;ctx.stroke();
    const ang=Math.atan2(dy,dx);
    ctx.beginPath();ctx.moveTo(ex,ey);
    ctx.lineTo(ex-8*Math.cos(ang-0.4),ey-8*Math.sin(ang-0.4));
    ctx.lineTo(ex-8*Math.cos(ang+0.4),ey-8*Math.sin(ang+0.4));
    ctx.closePath();ctx.fillStyle=REL_COLORS[l.rel]||'#aaa';ctx.globalAlpha=0.5;ctx.fill();
    ctx.globalAlpha=1;
    // 라벨: hover 시만
    if(mmHovered&&(mmHovered===l.sn||mmHovered===l.tn)){
      const mx=(A.x+ex)/2,my=(A.y+ey)/2;
      ctx.font='7px sans-serif';ctx.fillStyle='#9090b0';
      ctx.textAlign='center';ctx.fillText(l.type,mx,my-2);
    }
  });

  // Nodes
  mmNodes.forEach(n=>{
    const isH=mmHovered===n;
    const r=n.sz+(isH?3:0);
    const col=NODE_COLORS[n.id]||GRP_COLORS[n.grp]||'#6366f1';
    const isTopic=n.grp==='topic';
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);
    ctx.fillStyle=isTopic?col+'30':col+(isH?'ff':'cc');
    ctx.fill();
    ctx.strokeStyle=col;
    ctx.lineWidth=isTopic?1.5:2;
    ctx.stroke();
    // Label
    const lines=n.label.split('\n');
    ctx.font=`${n.sz>18?10:8}px sans-serif`;
    ctx.fillStyle='#1a1a30';ctx.textAlign='center';
    lines.forEach((line,i)=>{ctx.fillText(line,n.x,n.y+r+(i+1)*11);});
  });
  ctx.restore();
}

function animate(canvas){
  if(!mmAnimating)return;
  tick(canvas.width,canvas.height);
  draw(canvas);
  requestAnimationFrame(()=>animate(canvas));
}
function startAnim(){
  mmAnimating=true;
  const canvas=document.getElementById('mm-canvas');
  animate(canvas);
}

function toGraph(cx,cy,canvas){
  const rect=canvas.getBoundingClientRect();
  return{x:(cx-rect.left-mmOffset.x)/mmScale,y:(cy-rect.top-mmOffset.y)/mmScale};
}
function hitNode(gx,gy){return mmNodes.find(n=>{const dx=n.x-gx,dy=n.y-gy;return Math.sqrt(dx*dx+dy*dy)<=n.sz+5;});}

function setupCanvasEvents(canvas){
  let lastMx=0,lastMy=0,panning=false,panStart={x:0,y:0},panOff={x:0,y:0};
  let mouseDownX=0,mouseDownY=0,dragMoved=false;

  canvas.addEventListener('mousedown',e=>{
    const g=toGraph(e.clientX,e.clientY,canvas);
    const n=hitNode(g.x,g.y);
    mouseDownX=e.clientX;mouseDownY=e.clientY;dragMoved=false;
    if(n){mmDragging=n;} // alpha는 실제 드래그 이동 시에만 올림
    else{panning=true;panStart={x:e.clientX,y:e.clientY};panOff={x:mmOffset.x,y:mmOffset.y};}
  });
  canvas.addEventListener('mousemove',e=>{
    if(mmDragging){
      // 최소 4px 이상 움직여야 드래그로 인정 (클릭과 구분)
      if(!dragMoved){
        const dx=e.clientX-mouseDownX,dy=e.clientY-mouseDownY;
        if(Math.abs(dx)>4||Math.abs(dy)>4){
          dragMoved=true;
          // pinned 노드는 드래그 중에만 임시 unpin
          if(mmDragging&&mmDragging.pinned)mmDragging._wasPin=true;
        }
      }
      if(dragMoved){
        const g=toGraph(e.clientX,e.clientY,canvas);
        mmDragging.x=g.x;mmDragging.y=g.y;
      }
    } else if(panning){
      mmOffset.x=panOff.x+(e.clientX-panStart.x);
      mmOffset.y=panOff.y+(e.clientY-panStart.y);
    } else {
      const g=toGraph(e.clientX,e.clientY,canvas);
      const n=hitNode(g.x,g.y);
      mmHovered=n||null;
      canvas.style.cursor=n?'pointer':'default';
      if(n){
        const tt=document.getElementById('tooltip');
        const cnt=EVENTS.filter(ev=>(ev.companies||[ev.company]).includes(n.id)).length;
        const lnk=mmLinks.filter(l=>l.s===n.id||l.t===n.id).length;
        tt.innerHTML=`<h4>${n.label.replace('\n',' ')}</h4><p>연결: ${lnk}건${cnt?`<br>관련 이슈: ${cnt}건`:''}${n.grp!=='topic'?'<br><span style="color:#6366f1">더블클릭 → 캘린더 이동</span>':''}</p>`;
        tt.style.display='block';tt.style.left=(e.clientX+12)+'px';tt.style.top=(e.clientY-36)+'px';
      } else document.getElementById('tooltip').style.display='none';
    }
    lastMx=e.clientX;lastMy=e.clientY;
  });
  canvas.addEventListener('mouseup',()=>{
    if(mmDragging&&mmDragging._wasPin){
      mmDragging.pinned=true; // 드롭 후 다시 고정
      mmDragging._wasPin=false;
      mmDragging.vx=0;mmDragging.vy=0;
    }
    mmDragging=null;panning=false;dragMoved=false;
  });
  canvas.addEventListener('mouseleave',()=>{mmDragging=null;panning=false;document.getElementById('tooltip').style.display='none';});
  // 클릭 시 캘린더 강제 이동 제거 — 더블클릭으로만 이동
  canvas.addEventListener('dblclick',e=>{
    const g=toGraph(e.clientX,e.clientY,canvas);
    const n=hitNode(g.x,g.y);
    if(n&&n.grp!=='topic'){
      const rel=EVENTS.filter(ev=>(ev.companies||[ev.company]).includes(n.id));
      if(rel.length){const lat=[...rel].sort((a,b)=>b.date.localeCompare(a.date))[0];jumpTo(lat.date);}
    }
  });
  canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    const factor=e.deltaY<0?1.12:0.89;
    mmOffset.x=mx-(mx-mmOffset.x)*factor;
    mmOffset.y=my-(my-mmOffset.y)*factor;
    mmScale=Math.max(0.2,Math.min(4,mmScale*factor));
  },{passive:false});
}

function mmZoomIn(){const canvas=document.getElementById('mm-canvas');const W=canvas.width,H=canvas.height;mmOffset.x=W/2-(W/2-mmOffset.x)*1.25;mmOffset.y=H/2-(H/2-mmOffset.y)*1.25;mmScale=Math.min(4,mmScale*1.25);}
function mmZoomOut(){const canvas=document.getElementById('mm-canvas');const W=canvas.width,H=canvas.height;mmOffset.x=W/2-(W/2-mmOffset.x)*0.8;mmOffset.y=H/2-(H/2-mmOffset.y)*0.8;mmScale=Math.max(0.2,mmScale*0.8);}
function mmReset(){
  const canvas=document.getElementById('mm-canvas');
  if(!mmNodes.length)return;
  const W=canvas.width,H=canvas.height,pad=40;
  const xs=mmNodes.map(n=>n.x),ys=mmNodes.map(n=>n.y);
  const minX=Math.min(...xs)-pad,maxX=Math.max(...xs)+pad;
  const minY=Math.min(...ys)-pad,maxY=Math.max(...ys)+pad;
  const fw=maxX-minX,fh=maxY-minY;
  mmScale=Math.min(1.0,(W*0.96)/fw,(H*0.96)/fh);
  mmOffset.x=(W-fw*mmScale)/2-minX*mmScale;
  mmOffset.y=(H-fh*mmScale)/2-minY*mmScale;
}

// PEOPLE TAB RENDERING
// ═══════════════════════════════════════
const PPL_GRP_ORDER = ['ai-lab','bigtech','hw','korea','creative'];
let selCo = null;

function renderPplList(){
  const grouped = {};
  PPL_GRP_ORDER.forEach(g=>grouped[g]=[]);
  COMPANY_PROFILES.forEach(c=>{if(grouped[c.grp])grouped[c.grp].push(c);});
  let h='';
  PPL_GRP_ORDER.forEach(g=>{
    if(!grouped[g].length)return;
    h+=`<div class="ppl-grp-lbl">${GRP_LABELS[g]||g}</div>`;
    grouped[g].forEach(c=>{
      const col=CO_COLORS[c.id]||'#6366f1';
      const isSel=selCo===c.id;
      h+=`<button class="ppl-co-btn${isSel?' sel':''}" onclick="selectCo('${c.id}')">
        <div class="ppl-co-dot" style="background:${col}"></div>
        <span class="ppl-co-name">${c.id}</span>
      </button>`;
    });
  });
  document.getElementById('ppl-list').innerHTML=h;
  if(!selCo&&COMPANY_PROFILES.length)selectCo(COMPANY_PROFILES[0].id);
}

function selectCo(id){
  selCo=id;
  // update list selection
  document.querySelectorAll('.ppl-co-btn').forEach(b=>{
    b.classList.toggle('sel',b.textContent.trim()===id);
  });
  const co=COMPANY_PROFILES.find(c=>c.id===id);
  if(!co)return;
  const col=CO_COLORS[id]||'#6366f1';
  const grpLabel=GRP_LABELS[co.grp]||co.grp;
  const icon=CO_ICONS[id]||'🏢';
  // Related moves
  const moves=TALENT_MOVES.filter(m=>m.from.includes(id)||m.to.includes(id));

  const peopleHtml=co.people.map(p=>`
    <div class="person-card">
      <div class="person-name">${p.name}</div>
      <div class="person-role">${p.role}</div>
      <div class="person-note">${p.note}</div>
    </div>`).join('');

  const movesHtml=moves.length?moves.map(m=>{
    const dir=m.from.includes(id)?'출발':'합류';
    const badge=dir==='출발'
      ?`<span style="background:#ef4444;color:#fff;font-size:8px;padding:1px 5px;border-radius:3px;margin-left:5px">퇴사/이탈</span>`
      :`<span style="background:#10b981;color:#fff;font-size:8px;padding:1px 5px;border-radius:3px;margin-left:5px">합류</span>`;
    return`<div class="move-card">
      <div class="move-yr">${m.year}</div>
      <div class="move-body">
        <div class="move-person">${m.person}${badge}</div>
        <div class="move-path"><span>${m.from}</span><span class="arr">→</span><span>${m.to}</span></div>
        <div class="move-note">${m.note}</div>
      </div>
    </div>`;}).join('')
    :`<div style="color:var(--text3);font-size:11px;padding:10px 0">기록된 인재 이동 없음</div>`;

  document.getElementById('ppl-main').innerHTML=`
    <div class="co-hdr">
      <div class="co-icon" style="background:${col}22;border:2px solid ${col}44">${icon}</div>
      <div class="co-hdr-meta">
        <h2>${co.id}</h2>
        <div class="co-pills">
          <span class="co-grp-pill" style="background:${col}">${grpLabel}</span>
          <span class="co-info-pill">설립 ${co.founded}</span>
          <span class="co-info-pill">📍 ${co.hq}</span>
          ${co.valuation?`<span class="co-info-pill">💰 ${co.valuation}</span>`:''}
          <span class="co-ceo-pill">👤 ${co.ceo}</span>
        </div>
      </div>
    </div>
    <div class="co-desc">${co.desc}</div>
    <div class="sec-title">주요 제품 / 서비스</div>
    <div class="prod-wrap">${co.products.map(p=>`<span class="prod-chip">${p}</span>`).join('')}</div>
    <div class="sec-title">핵심 인물</div>
    <div class="ppl-grid">${peopleHtml}</div>
    <div class="sec-title">인재 이동 내역</div>
    <div class="moves-list">${movesHtml}</div>
    <div style="height:30px"></div>
  `;
}
